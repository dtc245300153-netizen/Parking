            function buildRevenueChart(revenueByDay) {
              const items = Array.isArray(revenueByDay) && revenueByDay.length
                ? revenueByDay.slice(-7).map((entry) => ({
                    label: entry.date ? entry.date.slice(5) : "-",
                    value: Math.max(0, Number(entry.revenue || 0)),
                  }))
                : [
                    { label: "Hôm nay", value: 0 },
                    { label: "-", value: 0 },
                    { label: "-", value: 0 },
                  ];

              return buildLineChart(items, {
                id: "daily-revenue",
                color: "blue",
                currency: true,
                description: "Doanh thu theo ngày",
              });
            }

            function buildHourlyTrafficChart(tickets) {
              const hourly = Array.from({ length: 24 }, (_, hour) => {
                const count = (Array.isArray(tickets) ? tickets : []).filter((ticket) => {
                  const raw = ticket.entry_time || ticket.check_in;
                  if (!raw) return false;
                  const date = parseAppDate(raw);
                  return !Number.isNaN(date.getTime()) && date.getHours() === hour;
                }).length;

                return {
                  label: `${hour}:00`,
                  value: count,
                };
              });

              return buildLineChart(hourly, {
                id: "hourly-traffic",
                color: "teal",
                description: "Số lượt xe theo giờ",
                xLabelInterval: 3,
              });
            }

            function buildLineChart(items, options = {}) {
              const chartItems = Array.isArray(items) && items.length
                ? items.map((item) => {
                    const value = Number(item.value);
                    return {
                      label: String(item.label ?? ""),
                      value: Number.isFinite(value) ? Math.max(0, value) : 0,
                    };
                  })
                : [{ label: "Chưa có dữ liệu", value: 0 }];
              const width = 760;
              const height = 240;
              const left = 66;
              const right = 18;
              const top = 18;
              const bottom = 38;
              const plotWidth = width - left - right;
              const plotHeight = height - top - bottom;
              const maxValue = Math.max(...chartItems.map((item) => item.value), 1);
              const points = chartItems.map((item, index) => ({
                ...item,
                x: chartItems.length === 1
                  ? left + plotWidth / 2
                  : left + (plotWidth * index) / (chartItems.length - 1),
                y: top + plotHeight - (item.value / maxValue) * plotHeight,
              }));
              const linePath = points.reduce((path, point, index) => {
                if (index === 0) return `M ${point.x} ${point.y}`;
                const previous = points[index - 1];
                const beforePrevious = points[index - 2] || previous;
                const next = points[index + 1] || point;
                const controlOneX = previous.x + (point.x - beforePrevious.x) / 6;
                const controlOneY = previous.y + (point.y - beforePrevious.y) / 6;
                const controlTwoX = point.x - (next.x - previous.x) / 6;
                const controlTwoY = point.y - (next.y - previous.y) / 6;
                return `${path} C ${controlOneX} ${controlOneY}, ${controlTwoX} ${controlTwoY}, ${point.x} ${point.y}`;
              }, "");
              const baseline = top + plotHeight;
              const areaPath = `${linePath} L ${points[points.length - 1].x} ${baseline} L ${points[0].x} ${baseline} Z`;
              const gradientId = `chart-gradient-${String(options.id || "data").replace(/[^a-z0-9-]/gi, "")}`;
              const lineClass = options.color === "teal" ? "chart-line chart-line-teal" : "chart-line";
              const pointClass = options.color === "teal" ? "chart-point chart-point-teal" : "chart-point";
              const valueLabel = (value) => options.currency ? formatMoney(value) : `${value} lượt`;
              const gridLines = [0, 0.5, 1].map((ratio) => {
                const y = top + plotHeight * (1 - ratio);
                const value = maxValue * ratio;
                const compact = (amount) => new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 1 }).format(amount);
                const label = options.currency
                  ? value >= 1_000_000_000
                    ? `${compact(value / 1_000_000_000)} tỷ ₫`
                    : value >= 1_000_000
                      ? `${compact(value / 1_000_000)} tr ₫`
                      : value >= 1_000
                        ? `${compact(value / 1_000)}k ₫`
                        : formatMoney(value)
                  : maxValue < 2 && ratio === 0.5
                    ? ""
                    : Math.round(value);
                return `
                  <g>
                    <line class="chart-gridline" x1="${left}" y1="${y}" x2="${width - right}" y2="${y}"></line>
                    <text class="chart-axis-label" x="${left - 10}" y="${y + 4}" text-anchor="end">${escapeHtml(label)}</text>
                  </g>
                `;
              }).join("");
              const chartPoints = points.map((point) => `
                <g class="${pointClass}" tabindex="0" role="graphics-symbol" aria-label="${escapeHtml(`${point.label}: ${valueLabel(point.value)}`)}">
                  <title>${escapeHtml(`${point.label}: ${valueLabel(point.value)}`)}</title>
                  <circle cx="${point.x}" cy="${point.y}" r="4"></circle>
                </g>
              `).join("");
              const xLabelInterval = Math.max(1, Number(options.xLabelInterval) || 1);
              const xLabels = points.map((point, index) => index % xLabelInterval === 0 || index === points.length - 1 ? `
                <text class="chart-axis-label" x="${point.x}" y="${height - 10}" text-anchor="middle">${escapeHtml(point.label)}</text>
              ` : "").join("");

              return `
                <svg class="line-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(options.description || "Biểu đồ dữ liệu")}">
                  <defs>
                    <linearGradient id="${gradientId}" x1="0" x2="0" y1="0" y2="1">
                      <stop offset="0%" stop-color="${options.color === "teal" ? "#d46f2b" : "#3c728e"}" stop-opacity="0.32"></stop>
                      <stop offset="100%" stop-color="${options.color === "teal" ? "#d46f2b" : "#3c728e"}" stop-opacity="0.015"></stop>
                    </linearGradient>
                  </defs>
                  ${gridLines}
                  <path class="chart-area" d="${areaPath}" fill="url(#${gradientId})"></path>
                  <path class="${lineClass}" d="${linePath}"></path>
                  ${chartPoints}
                  ${xLabels}
                </svg>
              `;
            }

            function statBox(icon, title, value) {
              return `
                <article class="stat-card">
                  <div class="stat-card-head">
                    <div class="stat-label">${escapeHtml(title)}</div>
                    <span class="stat-icon" aria-hidden="true">${icon}</span>
                  </div>
                  <div class="stat-number">${escapeHtml(value)}</div>
                </article>
              `;
            }

            /* =====================================================
                           SAVE MODAL
                        ===================================================== */

            async function saveModal() {
              if (modalMode === "addArea" || modalMode === "editArea") {
                const name = document.getElementById("areaName").value.trim();

                const description = document
                  .getElementById("areaDescription")
                  .value.trim();
                const vehicleType = document.getElementById("areaVehicleType").value;
                const capacity = Number(document.getElementById("areaCapacity").value);

                if (!name) {
                  alert("❌ Tên khu vực không được để trống");

                  return;
                }

                if (!Number.isInteger(capacity) || capacity < 0) {
                  alert("❌ Sức chứa phải là số nguyên không âm");

                  return;
                }

                const areaParams = new URLSearchParams();
                areaParams.append("name", name);
                areaParams.append("description", description);
                areaParams.append("vehicle_type", vehicleType);
                areaParams.append("capacity", String(capacity));

                await api(
                  modalMode === "addArea"
                    ? "/api/areas/"
                    : `/api/areas/${selectedId}`,
                  {
                  method: modalMode === "addArea" ? "POST" : "PUT",
                    headers: {
                      "Content-Type": "application/x-www-form-urlencoded",
                    },
                    body: areaParams.toString(),
                  },
                );

                alert(
                  modalMode === "addArea"
                    ? "✅ Đã thêm khu vực"
                    : "✅ Đã sửa khu vực",
                );

                closeModal();

                await loadParking();

                return;
              }

              /* ---------- SLOT ADD ---------- */

              if (modalMode === "addSlot") {
                const code = document.getElementById("slotCode").value.trim();

                if (!code) {
                  alert("❌ Mã vị trí không được để trống");

                  return;
                }

                await api("/api/slots/", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    slot_code: code,
                    area_id: selectedAreaId,
                    status: "available",
                  }),
                });

                alert("✅ Đã thêm vị trí");

                closeModal();

                loadParking();

                return;
              }

              /* ---------- SLOT EDIT ---------- */

              if (modalMode === "editSlot" || modalMode === "statusSlot") {
                const code = document.getElementById("slotCode")?.value.trim() || "";

                const status = document.getElementById("slotStatus").value;

                await api(`/api/areas/slots/${selectedId}`, {
                  method: "PUT",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    slot_code: code,
                    status,
                  }),
                });

                alert("✅ Đã cập nhật vị trí");

                closeModal();

                loadParking();

                return;
              }

              if (modalMode === "addEmployee") {
                const fullName = document.getElementById("employeeName").value.trim();
                const username = document.getElementById("employeeUsername").value.trim();
                const password = document.getElementById("employeePassword").value;
                const email = document.getElementById("employeeEmail").value.trim();
                const phone = document.getElementById("employeePhone").value.trim();
                if (!fullName || username.length < 3 || password.length < 8) {
                  showModalFeedback("Nhập họ tên, tài khoản tối thiểu 3 ký tự và mật khẩu tối thiểu 8 ký tự.");
                  return;
                }

                await api("/api/users", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    username,
                    password,
                    full_name: fullName,
                    email: email || null,
                    phone: phone || null,
                    role: "EMPLOYEE",
                    status: "ACTIVE",
                  }),
                });
                closeModal();
                await showEmployees();
                alert("Đã tạo tài khoản nhân viên.");
                return;
              }

              if (modalMode === "editEmployee") {
                const position = document.getElementById("employeePosition").value.trim();
                if (!position) {
                  showModalFeedback("Chức vụ không được để trống.");
                  return;
                }
                await api(`/api/employees/${selectedId}`, {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ position }),
                });
                closeModal();
                await showEmployees();
                return;
              }

              /* ---------- VEHICLE ---------- */

              if (modalMode === "addVehicle" || modalMode === "editVehicle") {
                const plate = document.getElementById("vehiclePlate").value.trim();

                const type = document.getElementById("vehicleType").value;

                const customerId = document.getElementById("vehicleCustomer")?.value || "";

                if (!plate) {
                  alert("❌ Biển số không được để trống");

                  return;
                }

                if (!customerId) {
                  alert("❌ Vui lòng chọn khách hàng cho phương tiện");

                  return;
                }

                const params = new URLSearchParams();

                params.append("license_plate", plate);

                params.append("vehicle_type", type);

                params.append("customer_id", customerId);

                await api(
                  modalMode === "addVehicle"
                    ? "/api/vehicles/"
                    : `/api/vehicles/${selectedId}`,

                  {
                    method: modalMode === "addVehicle" ? "POST" : "PUT",

                    headers: {
                      "Content-Type": "application/x-www-form-urlencoded",
                    },

                    body: params.toString(),
                  },
                );

                alert(
                  modalMode === "addVehicle"
                    ? "✅ Đã thêm phương tiện"
                    : "✅ Đã cập nhật phương tiện",
                );

                closeModal();

                showVehicles();

                return;
              }

              /* ---------- VEHICLE ENTRY ---------- */

              if (modalMode === "vehicleEntry") {
                const vehicleId = document.getElementById("entryVehicle").value;

                const slotId = document.getElementById("entrySlot").value;

                if (!vehicleId || !slotId) {
                  alert("❌ Cần chọn xe và vị trí");

                  return;
                }

                await api("/api/tickets/entry", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    vehicle_id: Number(vehicleId),
                    slot_id: Number(slotId),
                  }),
                });
                await loadParking();

                alert("✅ Xe đã vào bãi");

                closeModal();

                showTickets();

                return;
              }

              /* ---------- PRICE ---------- */

              if (modalMode === "addPrice" || modalMode === "editPrice") {
                const type = document.getElementById("priceVehicleType").value.trim();
                const fromMinute = Number(document.getElementById("priceFromMinute").value);
                const toMinute = Number(document.getElementById("priceToMinute").value);
                const amount = Number(document.getElementById("priceAmount").value);
                const effectiveFrom = document.getElementById("priceEffectiveFrom").value;
                const effectiveTo = document.getElementById("priceEffectiveTo").value;
                const status = document.getElementById("priceStatus").value;

                if (!Number.isInteger(fromMinute) || fromMinute < 0
                    || !Number.isInteger(toMinute) || toMinute < 0
                    || !Number.isFinite(amount) || amount < 0
                    || !effectiveFrom) {
                  showModalFeedback("Kiểm tra loại xe, khoảng thời gian, đơn giá và ngày hiệu lực.");
                  return;
                }

                if (toMinute !== 0 && toMinute < fromMinute) {
                  showModalFeedback("Mốc phút kết thúc phải lớn hơn hoặc bằng mốc bắt đầu.");
                  return;
                }

                const params = new URLSearchParams();

                params.append("vehicle_type", type);

                params.append("from_minute", String(fromMinute));
                params.append("to_minute", String(toMinute));
                params.append("price", String(amount));
                params.append("effective_from", effectiveFrom);
                params.append("effective_to", effectiveTo);
                params.append("status", status);

                await api(
                  modalMode === "addPrice"
                    ? "/api/prices/"
                    : `/api/prices/${selectedId}`,

                  {
                    method: modalMode === "addPrice" ? "POST" : "PUT",

                    headers: {
                      "Content-Type": "application/x-www-form-urlencoded",
                    },

                    body: params.toString(),
                  },
                );

                closeModal();

                showPrices();

                return;
              }

              throw new Error("Không xác định được loại dữ liệu cần lưu");
            }

            async function saveModalWithFeedback() {
              const saveButton = document.getElementById("modalSaveButton");
              if (saveButton.disabled) {
                return;
              }

              saveButton.disabled = true;
              try {
                await saveModal();
              } catch (error) {
                console.error("Không thể lưu dữ liệu:", error);
                const message = (error.message || "Không thể lưu dữ liệu.")
                  .replace(/^HTTP \d+(?: [^:]+)?:\s*/, "");
                showModalFeedback(message);
              } finally {
                saveButton.disabled = false;
              }
            }

                         STATS HEADER
                      ===================================================== */

              /* =====================================================
                           FORMAT
                        ===================================================== */

              function formatMoney(value) {
                const amount = Number(value);

                return `${Number.isFinite(amount) ? amount : 0}`.replace(
                  /\B(?=(\d{3})+(?!\d))/g,
                  ".",
                ) + " ₫";
              }

              function parseAppDate(value) {
                if (value instanceof Date) {
                  return value;
                }

                if (typeof value !== "string" || !value.trim()) {
                  return new Date(Number.NaN);
                }

                const normalized = value.trim().replace(" ", "T");
                if (/^\d{4}-\d{2}-\d{2}$/.test(normalized)) {
                  return new Date(`${normalized}T00:00:00`);
                }

                const hasTimezone = /(?:[zZ]|[+-]\d{2}:?\d{2})$/.test(normalized);
                return new Date(hasTimezone ? normalized : `${normalized}Z`);
              }

              function formatDate(value) {
                if (!value) {
                  return "-";
                }

                const date = parseAppDate(value);

                return Number.isNaN(date.getTime())
                  ? "-"
                  : date.toLocaleString("vi-VN");
              }

              /* =====================================================
                           LOGOUT
                        ===================================================== */

              function logout() {
                localStorage.removeItem("access_token");

                localStorage.removeItem("username");

                window.location.href = "/login";
              }

              /* =====================================================
                           USER
                        ===================================================== */

              const savedUsername = localStorage.getItem("username");

              if (savedUsername) {
                document.getElementById("username").textContent = savedUsername;
              }

              /* =====================================================
                           MODAL CLICK OUTSIDE
                        ===================================================== */

              document
                .getElementById("modal")
                .addEventListener("click", function (event) {
                  if (event.target === this) {
                    closeModal();
                  }
                });

                document
                  .getElementById("aiForm")
                  .addEventListener("submit", function (event) {
                    event.preventDefault();
                    askAi();
                  });

              /* =====================================================
                           START
                        ===================================================== */

              if (!token()) {
                window.location.href = "/login";
              } else {
                configureAdminMenu();
                startLiveDashboard();
                showOverview();
              }
