<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <title>Parking - Quản lý bãi đỗ xe</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
      }

      button,
      input,
      select {
        font-family: inherit;
      }

      button {
        cursor: pointer;
      }

      /* ================= HEADER ================= */

      .header {
        height: 68px;
        background: #172554;
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .logo {
        font-size: 21px;
        font-weight: bold;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logout {
        border: 0;
        background: #dc2626;
        color: white;
        padding: 9px 14px;
        border-radius: 7px;
      }

      .logout:hover {
        background: #b91c1c;
      }

      /* ================= LAYOUT ================= */

      .layout {
        display: flex;
        min-height: calc(100vh - 68px);
      }

      .sidebar {
        width: 235px;
        background: white;
        border-right: 1px solid #e2e8f0;
        padding: 18px 12px;
        flex-shrink: 0;
      }

      .menu-title {
        color: #94a3b8;
        font-size: 12px;
        font-weight: bold;
        margin: 15px 12px 8px;
      }

      .menu-item {
        width: 100%;
        border: 0;
        background: transparent;
        color: #475569;
        text-align: left;
        padding: 12px 14px;
        margin-bottom: 5px;
        border-radius: 8px;
        font-size: 14px;
      }

      .menu-item:hover {
        background: #eff6ff;
        color: #2563eb;
      }

      .menu-item.active {
        background: #dbeafe;
        color: #1d4ed8;
        font-weight: bold;
      }

      /* ================= CONTENT ================= */

      .content {
        flex: 1;
        padding: 28px;
        min-width: 0;
      }

      .page-title {
        font-size: 27px;
        margin-bottom: 5px;
      }

      .subtitle {
        color: #64748b;
        margin-bottom: 24px;
      }

      /* ================= STATS ================= */

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 20px;
      }

      .stat-card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        border: 1px solid #e2e8f0;
      }

      .stat-label {
        color: #64748b;
        font-size: 13px;
      }

      .stat-number {
        font-size: 29px;
        font-weight: bold;
        margin-top: 8px;
      }

      /* ================= PANEL ================= */

      .panel {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 22px;
        margin-bottom: 20px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
      }

      .panel-title {
        font-size: 19px;
        font-weight: bold;
      }

      /* ================= BUTTON ================= */

      .btn {
        border: 0;
        border-radius: 7px;
        padding: 9px 14px;
        font-weight: bold;
      }

      .btn-primary {
        background: #2563eb;
        color: white;
      }

      .btn-primary:hover {
        background: #1d4ed8;
      }

      .btn-success {
        background: #16a34a;
        color: white;
      }

      .btn-warning {
        background: #f59e0b;
        color: white;
      }

      .btn-danger {
        background: #dc2626;
        color: white;
      }

      .btn-gray {
        background: #e2e8f0;
        color: #334155;
      }

      .btn-small {
        padding: 7px 10px;
        font-size: 12px;
      }

      /* ================= TABLE ================= */

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #f8fafc;
        color: #475569;
        font-size: 13px;
        text-align: left;
        padding: 13px;
        border-bottom: 1px solid #e2e8f0;
      }

      td {
        padding: 13px;
        border-bottom: 1px solid #e2e8f0;
        font-size: 14px;
      }

      tr:hover td {
        background: #f8fafc;
      }

      /* ================= PARKING ================= */

      .area {
        margin-bottom: 28px;
      }

      .area-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 13px;
      }

      .area-name {
        font-size: 17px;
        font-weight: bold;
      }

      .area-description {
        color: #64748b;
        font-size: 13px;
        margin-top: 3px;
      }

      .parking-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }

      .slot {
        min-height: 105px;
        border-radius: 10px;
        padding: 14px;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: 0.15s;
      }

      .slot:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      }

      .slot.available {
        background: #16a34a;
      }

      .slot.occupied {
        background: #dc2626;
      }

      .slot.reserved {
        background: #d97706;
      }

        .slot.inactive {
          background: #475569;
        }

      .slot-code {
        font-size: 18px;
        font-weight: bold;
      }

      .slot-status {
        font-size: 13px;
      }

      .slot-actions {
        display: flex;
        gap: 5px;
      }

      .slot-actions button {
        border: 0;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border-radius: 5px;
        padding: 5px 7px;
        font-size: 11px;
      }

      /* ================= BADGE ================= */

      .badge {
        display: inline-block;
        padding: 5px 9px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
      }

      .badge-green {
        background: #dcfce7;
        color: #15803d;
      }

      .badge-red {
        background: #fee2e2;
        color: #b91c1c;
      }

      .badge-yellow {
        background: #fef3c7;
        color: #b45309;
      }

        .badge-gray {
          background: #e2e8f0;
          color: #334155;
        }

      /* ================= MODAL ================= */

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 15px;
      }

      .modal.show {
        display: flex;
      }

      .modal-box {
        width: 450px;
        max-width: 100%;
        background: white;
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        max-height: 90vh;
        overflow-y: auto;
      }

      .modal-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        font-size: 14px;
      }

      .form-control {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        outline: none;
      }

      .form-control:focus {
        border-color: #2563eb;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }

      .ai-launcher {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 1100;
        border: 0;
        border-radius: 999px;
        padding: 13px 17px;
        background: #0f766e;
        color: white;
        font-weight: 700;
        box-shadow: 0 10px 24px rgba(15, 118, 110, 0.28);
      }

      .ai-launcher:hover {
        background: #115e59;
      }

      .ai-panel {
        position: fixed;
        right: 24px;
        bottom: 82px;
        z-index: 1100;
        display: none;
        width: min(390px, calc(100vw - 30px));
        height: min(590px, calc(100vh - 110px));
        overflow: hidden;
        flex-direction: column;
        background: white;
        border: 1px solid #cbd5e1;
        border-radius: 14px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.24);
      }

      .ai-panel.show {
        display: flex;
      }

      .ai-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 17px;
        background: #115e59;
        color: white;
      }

      .ai-header strong {
        font-size: 16px;
      }

      .ai-close {
        border: 0;
        background: transparent;
        color: white;
        font-size: 22px;
        line-height: 1;
      }

      .ai-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        background: #f8fafc;
      }

      .ai-message {
        max-width: 88%;
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        white-space: pre-wrap;
        line-height: 1.45;
        font-size: 14px;
      }

      .ai-message.assistant {
        margin-right: auto;
        background: white;
        border: 1px solid #e2e8f0;
        color: #334155;
      }

      .ai-message.user {
        margin-left: auto;
        background: #ccfbf1;
        color: #134e4a;
      }

      .ai-quick-actions {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding: 10px 12px 0;
        background: #f8fafc;
      }

      .ai-quick-actions button {
        flex: 0 0 auto;
        border: 1px solid #99f6e4;
        border-radius: 999px;
        padding: 6px 9px;
        background: white;
        color: #115e59;
        font-size: 12px;
      }

      .ai-form {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #e2e8f0;
        background: white;
      }

      .ai-form input {
        min-width: 0;
        flex: 1;
      }

      .ai-send {
        width: 42px;
        border: 0;
        border-radius: 8px;
        background: #0f766e;
        color: white;
        font-size: 18px;
      }

      /* ================= EMPTY ================= */

      .empty {
        text-align: center;
        padding: 40px 20px;
        color: #64748b;
      }
      /* ================= FIX PARKING UI ================= */

      .area {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 22px;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
      }

      .area-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 16px;
      }

      .area-info {
        min-width: 0;
      }

      .area-name {
        font-size: 20px;
        font-weight: 700;
        color: #172554;
      }

      .area-description {
        color: #64748b;
        font-size: 14px;
        margin-top: 5px;
      }

      .area-count {
        display: inline-block;
        margin-top: 8px;
        padding: 5px 10px;
        background: #eff6ff;
        color: #2563eb;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }

      .area-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .parking-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(130px, 1fr));
        gap: 14px;
      }

      .slot {
        min-height: 120px;
        border-radius: 12px;
        padding: 16px;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .slot.available {
        background: #16a34a;
      }

      .slot.occupied {
        background: #dc2626;
      }

      .slot.reserved {
        background: #f59e0b;
      }

      .slot-code {
        font-size: 23px;
        font-weight: 800;
      }

      .slot-status {
        font-size: 14px;
        margin-top: 4px;
      }

      .slot-actions {
        display: flex;
        gap: 7px;
        margin-top: 15px;
      }

      .slot-actions button {
        width: 34px;
        height: 32px;
        border: 0;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.18);
        color: white;
        cursor: pointer;
      }

      .slot-empty {
        grid-column: 1 / -1;
        min-height: 120px;
        border: 1px dashed #cbd5e1;
        background: #f8fafc;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        color: #64748b;
      }

      .ticket-summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 20px;
      }

      .parking-filters {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        gap: 10px;
        margin-bottom: 18px;
      }

      .mini-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .mini-card span {
        color: #64748b;
      }

      .mini-card strong {
        font-size: 24px;
        color: #172554;
      }

      .error-panel {
        border-color: #fecaca;
        background: #fffafa;
      }

      .area-stat-list {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        overflow: hidden;
      }

      .area-stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px;
        border-bottom: 1px solid #e2e8f0;
      }

      .area-stat-row:last-child {
        border-bottom: 0;
      }

      .area-stat-values {
        display: flex;
        gap: 16px;
      }

      .text-green {
        color: #15803d !important;
      }

      .text-red {
        color: #b91c1c !important;
      }
      /* ================= RESPONSIVE ================= */

      @media (max-width: 1000px) {
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }

        .parking-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (max-width: 700px) {
        .sidebar {
          display: none;
        }

        .content {
          padding: 15px;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        .parking-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .parking-filters {
          grid-template-columns: 1fr;
        }

        .header {
          padding: 0 15px;
        }

        .ai-launcher {
          right: 15px;
          bottom: 15px;
        }

        .ai-panel {
          right: 15px;
          bottom: 70px;
          height: min(560px, calc(100vh - 90px));
        }
      }
    </style>
  </head>

  <body>
    <header class="header">
      <div class="logo">🅿️ PARKING</div>

      <div class="user-info">
        👤 <span id="username">Quản trị viên</span>

        <button class="logout" onclick="logout()">Đăng xuất</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="menu-title">QUẢN LÝ</div>

        <button
          class="menu-item active"
          id="menuParking"
          onclick="showParking()"
        >
          🅿️ Bãi đỗ xe
        </button>

        <button class="menu-item" id="menuVehicles" onclick="showVehicles()">
          🚗 Phương tiện
        </button>

        <button class="menu-item" id="menuTickets" onclick="showTickets()">
          🎫 Vé xe
        </button>

        <button class="menu-item" id="menuPrices" onclick="showPrices()">
          💵 Bảng giá
        </button>

        <button class="menu-item" id="menuRevenue" onclick="showRevenue()">
          💰 Doanh thu
        </button>

        <div class="menu-title">PHÂN TÍCH</div>

        <button
          class="menu-item"
          id="menuStatistics"
          onclick="showStatistics()"
        >
          📊 Thống kê
        </button>
      </aside>

      <main class="content">
        <h1 class="page-title" id="pageTitle">Quản lý bãi đỗ xe</h1>

        <p class="subtitle" id="pageSubtitle">Theo dõi tình trạng chỗ đỗ</p>

        <section class="stats">
          <div class="stat-card">
            <div class="stat-label">Tổng vị trí</div>
            <div class="stat-number" id="totalSlots">--</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Chỗ trống</div>
            <div class="stat-number" id="availableSlots">--</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Đang đỗ</div>
            <div class="stat-number" id="occupiedSlots">--</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Đã giữ</div>
            <div class="stat-number" id="reservedSlots">--</div>
          </div>
        </section>

        <div id="mainContent"></div>
      </main>
    </div>

    <div class="modal" id="modal">
      <div class="modal-box">
        <div class="modal-title" id="modalTitle">Thao tác</div>

        <div id="modalBody"></div>

        <div class="modal-actions">
          <button class="btn btn-gray" onclick="closeModal()">Hủy</button>

          <button
            class="btn btn-primary"
            id="modalSaveButton"
            onclick="saveModal()"
          >
            Lưu
          </button>
        </div>
      </div>
    </div>

    <button
      class="ai-launcher"
      id="aiLauncher"
      type="button"
      onclick="toggleAiChat()"
      aria-controls="aiPanel"
      aria-expanded="false">
      🤖 Parking
    </button>

    <section class="ai-panel" id="aiPanel" aria-label="Parking Assistant">
      <header class="ai-header">
        <strong>🤖 Parking</strong>
        <button class="ai-close" type="button" onclick="toggleAiChat()" aria-label="Đóng trợ lý">×</button>
      </header>

      <div class="ai-messages" id="aiMessages" role="log" aria-live="polite">
        <div class="ai-message assistant">
          Xin chào! Tôi có thể giúp bạn phân tích dữ liệu bãi đỗ hiện tại.
        </div>
      </div>

      <div class="ai-quick-actions" aria-label="Câu hỏi nhanh">
        <button type="button" onclick="askAi('Bãi còn bao nhiêu chỗ?')">Chỗ trống?</button>
        <button type="button" onclick="askAi('Doanh thu hôm nay bao nhiêu?')">Doanh thu hôm nay?</button>
        <button type="button" onclick="askAi('Bãi đang sử dụng bao nhiêu phần trăm công suất?')">Công suất?</button>
      </div>

      <form class="ai-form" id="aiForm">
        <input id="aiInput" type="text" placeholder="Nhập câu hỏi..." autocomplete="off" aria-label="Câu hỏi cho Parking">
        <button class="ai-send" type="submit" aria-label="Gửi câu hỏi">➤</button>
      </form>
    </section>

    <script>
            let modalMode = null;
            let selectedId = null;
            let selectedAreaId = null;
            let parkingAreaData = [];
            let statsTimer = null;

            const token = () => localStorage.getItem("access_token");
            function updateStats(total, available, occupied, reserved) {
              document.getElementById("totalSlots").textContent = Number(total || 0);
              document.getElementById("availableSlots").textContent = Number(available || 0);
              document.getElementById("occupiedSlots").textContent = Number(occupied || 0);
              document.getElementById("reservedSlots").textContent = Number(reserved || 0);
            }

            async function refreshStats() {
              try {
                const data = await api("/api/dashboard/summary");
                updateStats(
                  data.total_slots,
                  data.available_slots,
                  data.occupied_slots,
                  data.reserved_slots,
                );
              } catch (error) {
                console.error("Không thể tải chỉ số tổng quan:", error);
              }
            }

            function filterParking() {
              const query = (
                document.getElementById("parkingSearch")?.value || ""
              ).trim().toLowerCase();
              const status =
                document.getElementById("parkingStatusFilter")?.value || "";
              const areaId =
                document.getElementById("parkingAreaFilter")?.value || "";

              document.querySelectorAll(".area[data-area-id]").forEach((area) => {
                const matchesArea = !areaId || area.dataset.areaId === areaId;
                let visibleSlots = 0;

                area.querySelectorAll(".slot").forEach((slot) => {
                  const matchesQuery = !query || [
                    slot.dataset.slotCode,
                    slot.dataset.vehicleType,
                    slot.textContent,
                  ].some((value) => value.toLowerCase().includes(query));
                  const matchesStatus = !status || slot.dataset.status === status;
                  const visible = matchesArea && matchesQuery && matchesStatus;

                  slot.style.display = visible ? "" : "none";
                  if (visible) {
                    visibleSlots += 1;
                  }
                });

                area.style.display = matchesArea && (visibleSlots > 0 || !query && !status)
                  ? ""
                  : "none";
              });
            }

            function filterRows(inputId, rowSelector) {
              const query = (
                document.getElementById(inputId)?.value || ""
              ).trim().toLowerCase();

              document.querySelectorAll(rowSelector).forEach((row) => {
                row.style.display = row.textContent.toLowerCase().includes(query)
                  ? ""
                  : "none";
              });
            }

            function apiError(data) {
              if (!data) {
                return "Lỗi không xác định";
              }

              if (typeof data === "string") {
                return data;
              }

              if (typeof data.detail === "string") {
                return data.detail;
              }

              if (Array.isArray(data.detail)) {
                return data.detail
                  .map((item) => {
                    if (typeof item === "string") {
                      return item;
                    }

                    if (item.msg) {
                      return item.msg;
                    }

                    return JSON.stringify(item);
                  })
                  .join("\n");
              }

              if (data.message) {
                return data.message;
              }

              return JSON.stringify(data);
            }

            async function api(url, options = {}) {
              const response = await fetch(url, {
                ...options,

                headers: {
                  ...(options.headers || {}),
                  Authorization: "Bearer " + token(),
                },
              });

              let data = {};

              try {
                data = await response.json();
              } catch {
                data = {};
              }

              if (response.status === 401) {
                localStorage.removeItem("access_token");
                localStorage.removeItem("username");

                window.location.href = "/login";

                throw new Error("Phiên đăng nhập đã hết hạn");
              }

              if (!response.ok) {
                throw new Error(apiError(data));
              }

              return data;
            }

              if (isOpen) {
                document.getElementById("aiInput").focus();
              }
            }

            function appendAiMessage(role, message) {
              const messages = document.getElementById("aiMessages");
              const item = document.createElement("div");
              item.className = `ai-message ${role}`;
              item.textContent = message;
              messages.appendChild(item);
              messages.scrollTop = messages.scrollHeight;
              return item;
            }

            async function askAi(question) {
              const input = document.getElementById("aiInput");
              const text = (question || input.value).trim();
              if (!text) {
                return;
              }

              input.value = "";
              appendAiMessage("user", text);
              const loading = appendAiMessage("assistant", "Đang đọc dữ liệu bãi đỗ...");

              try {
                const result = await api("/api/ai/assistant", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({ question: text }),
                });
                loading.textContent = result.answer || "Không có dữ liệu trả lời.";
              } catch (error) {
                loading.textContent = error.message || "Không thể truy vấn dữ liệu bãi đỗ.";
              }
            }

            async function saveModal() {
              if (modalMode === "addArea" || modalMode === "editArea") {

                const description = document
                  .getElementById("areaDescription")
                  .value.trim();

                  alert("❌ Tên khu vực không được để trống");

                  return;

                const areaParams = new URLSearchParams();
                areaParams.append("name", name);
                areaParams.append("description", description);

                await api(
                  modalMode === "addArea"
                    ? "/api/areas/"
                    : `/api/areas/${selectedId}`,
                  {
                  method: modalMode === "addArea" ? "POST" : "PUT",
                    headers: {
                      "Content-Type": "application/x-www-form-urlencoded",
                    },
                    body: areaParams.toString(),
                  },
                );

                alert(

              /* =====================================================

                        ===================================================== */

              function formatMoney(value) {
                const amount = Number(value);

                return `${Number.isFinite(amount) ? amount : 0}`.replace(
                  /\B(?=(\d{3})+(?!\d))/g,
                  ".",
                ) + " ₫";
              }

              function formatDate(value) {
                if (!value) {
                  return "-";
                }

                const date = new Date(value);

                return Number.isNaN(date.getTime())
                  ? "-"
                  : date.toLocaleString("vi-VN");
              }

                window.location.href = "/login";
              }

              /* =====================================================
                           USER
                        ===================================================== */

              const savedUsername = localStorage.getItem("username");

              if (savedUsername) {
                document.getElementById("username").textContent = savedUsername;
              }

              /* =====================================================
                           MODAL CLICK OUTSIDE
                        ===================================================== */

              document
                .getElementById("modal")
                .addEventListener("click", function (event) {
                  if (event.target === this) {
                    closeModal();
                  }
                });

                document
                  .getElementById("aiForm")
                  .addEventListener("submit", function (event) {
                    event.preventDefault();
                    askAi();
                  });

              /* =====================================================
                           START
                        ===================================================== */

              if (!token()) {
                window.location.href = "/login";
              } else {
                startLiveDashboard();
                showParking();
              }
    </script>
  </body>
</html>
