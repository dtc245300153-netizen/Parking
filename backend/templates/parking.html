<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <title>Parking - Quản lý bãi đỗ xe</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #172033;
      }

      button,
      input,
      select {
        font-family: inherit;
      }

      button {
        cursor: pointer;
      }

      /* ================= HEADER ================= */

      .header {
        height: 68px;
        background: linear-gradient(110deg, #102247 0%, #1748a0 58%, #2563eb 100%);
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 8px 24px rgba(17, 36, 73, 0.16);
      }

      .logo {
        font-size: 21px;
        font-weight: bold;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logout {
        border: 0;
        background: #dc2626;
        color: white;
        padding: 9px 14px;
        border-radius: 9px;
        font-weight: 700;
      }

      .logout:hover {
        background: #b91c1c;
      }

      /* ================= LAYOUT ================= */

      .layout {
        display: flex;
        min-height: calc(100vh - 72px);
      }

      .sidebar {
        width: 248px;
        background: #fff;
        border-right: 1px solid #e2e8f0;
        padding: 22px 14px;
        flex-shrink: 0;
      }

      .menu-title {
        color: #94a3b8;
        font-size: 12px;
        font-weight: bold;
        margin: 15px 12px 8px;
      }

      .menu-item {
        width: 100%;
        border: 0;
        background: transparent;
        color: #475569;
        text-align: left;
        padding: 12px 14px;
        margin-bottom: 6px;
        border-radius: 11px;
        font-size: 14px;
        transition: color 160ms ease, background 160ms ease, transform 160ms ease;
      }

      .menu-item:hover {
        background: #f1f6ff;
        color: #2563eb;
        transform: translateX(2px);
      }

      .menu-item.active {
        background: #e8f0ff;
        color: #1b55c5;
        font-weight: bold;
        box-shadow: inset 3px 0 #3478f6;
      }

      /* ================= CONTENT ================= */

      .content {
        flex: 1;
        padding: 30px clamp(20px, 3vw, 46px);
        min-width: 0;
        max-width: 1720px;
      }

      .page-title {
        font-size: clamp(24px, 2.2vw, 31px);
        letter-spacing: -0.035em;
        margin-bottom: 7px;
      }

      .subtitle {
        color: #64748b;
        margin-bottom: 26px;
        line-height: 1.55;
      }

      /* ================= STATS ================= */

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        margin-bottom: 24px;
      }

      .stat-card {
        position: relative;
        min-height: 126px;
        background: #fff;
        border-radius: 20px;
        padding: 20px 21px;
        border: 1px solid #e8edf5;
        box-shadow: 0 5px 16px rgba(18, 38, 71, 0.045), 0 1px 3px rgba(18, 38, 71, 0.035);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 26px rgba(18, 38, 71, 0.09);
      }

      .stat-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .stat-label {
        color: #64748b;
        font-size: 13px;
        font-weight: 600;
      }

      .stat-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: #eef2f6;
        color: #475569;
        font-size: 15px;
        font-weight: 800;
      }

      .stat-icon--blue {
        border-color: #d7e6f7;
        background: #eaf2fb;
        color: #2563a6;
      }

      .stat-icon--green {
        border-color: #c5ead2;
        background: #e5f5ec;
        color: #16834a;
      }

      .stat-icon--rose {
        border-color: #f5cbd4;
        background: #fbe9ed;
        color: #be3455;
      }

      .stat-icon--amber {
        border-color: #f1dfb8;
        background: #fff3d9;
        color: #a45c08;
      }

      .stat-number {
        font-size: clamp(26px, 2.3vw, 32px);
        line-height: 1.2;
        letter-spacing: -0.035em;
        font-weight: 750;
        margin-top: 15px;
        color: #15213a;
      }

      .statistics-board {
        display: grid;
        gap: 26px;
        margin-bottom: 28px;
      }

      .statistics-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        padding: 2px 0 17px;
        border-bottom: 1px solid #dfe5ec;
      }

      .statistics-kicker {
        margin: 0 0 6px;
        color: #0f766e;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .statistics-heading h2 {
        margin: 0;
        color: #172033;
        font-size: 23px;
        line-height: 1.2;
      }

      .statistics-heading p {
        margin: 6px 0 0;
        color: #64748b;
        font-size: 13px;
      }

      .statistics-source {
        flex: 0 0 auto;
        padding: 7px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        color: #475569;
        font-size: 12px;
        font-weight: 650;
      }

      .statistics-section {
        display: grid;
        gap: 12px;
      }

      .statistics-section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      .statistics-section-head h3 {
        margin: 0;
        color: #243247;
        font-size: 16px;
      }

      .statistics-section-head span {
        color: #64748b;
        font-size: 12px;
      }

      .statistics-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .statistics-board .stat-card {
        --stat-accent: #2563a6;
        --stat-soft: #eaf2fb;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 38px;
        grid-template-rows: auto auto 1fr;
        align-items: start;
        min-width: 0;
        min-height: 126px;
        padding: 15px 16px 13px;
        border: 1px solid #e2e8f0;
        border-left: 3px solid var(--stat-accent);
        border-radius: 9px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.045);
        transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
      }

      .statistics-board .stat-card:hover {
        transform: translateY(-2px);
        border-color: var(--stat-accent);
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.09);
      }

      .statistics-board .stat-card[data-tone="green"] {
        --stat-accent: #16834a;
        --stat-soft: #e5f5ec;
      }

      .statistics-board .stat-card[data-tone="rose"] {
        --stat-accent: #be3455;
        --stat-soft: #fbe9ed;
      }

      .statistics-board .stat-card[data-tone="amber"] {
        --stat-accent: #a45c08;
        --stat-soft: #fff3d9;
      }

      .statistics-board .stat-card[data-tone="teal"] {
        --stat-accent: #087f82;
        --stat-soft: #e1f4f2;
      }

      .statistics-board .stat-card[data-tone="blue"] {
        --stat-accent: #2563a6;
        --stat-soft: #eaf2fb;
      }

      .statistics-board .stat-card[data-tone="slate"] {
        --stat-accent: #475569;
        --stat-soft: #eef2f6;
      }

      .statistics-board .stat-card-head {
        display: contents;
      }

      .statistics-board .stat-label {
        grid-column: 1;
        color: #526174;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.35;
      }

      .statistics-board .stat-icon {
        grid-column: 2;
        grid-row: 1 / span 2;
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 7px;
        background: var(--stat-soft);
        color: var(--stat-accent);
        font-size: 15px;
        font-weight: 800;
      }

      .statistics-board .stat-number {
        grid-column: 1;
        margin-top: 10px;
        color: #162235;
        font-size: 25px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }

      .stat-detail {
        grid-column: 1 / -1;
        align-self: end;
        margin-top: 11px;
        padding-top: 8px;
        border-top: 1px solid #edf1f5;
        color: #718096;
        font-size: 11px;
        line-height: 1.35;
      }

      @media (max-width: 1000px) {
        .statistics-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 700px) {
        .statistics-heading {
          align-items: flex-start;
          flex-direction: column;
        }

        .statistics-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }

        .statistics-board .stat-card {
          min-height: 120px;
          padding: 13px;
        }

        .statistics-board .stat-number {
          font-size: 23px;
        }
      }

      /* ================= PANEL ================= */

      .panel {
        background: #fff;
        border: 1px solid #e8edf5;
        border-radius: 22px;
        padding: clamp(18px, 2vw, 28px);
        margin-bottom: 22px;
        box-shadow: 0 8px 26px rgba(18, 38, 71, 0.055), 0 1px 3px rgba(18, 38, 71, 0.035);
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
      }

      .panel-title {
        font-size: 20px;
        font-weight: bold;
        letter-spacing: -0.02em;
      }

      /* ================= BUTTON ================= */

      .btn {
        border: 0;
        border-radius: 7px;
        padding: 9px 14px;
        font-weight: bold;
      }

      .btn-primary {
        background: #2563eb;
        color: white;
      }

      .btn-primary:hover {
        background: #1d4ed8;
      }

      .btn-success {
        background: #16a34a;
        color: white;
      }

      .btn-warning {
        background: #f59e0b;
        color: white;
      }

      .btn-danger {
        background: #dc2626;
        color: white;
      }

      .btn-gray {
        background: #e2e8f0;
        color: #334155;
      }

      .btn-small {
        padding: 7px 10px;
        font-size: 12px;
      }

      /* ================= TABLE ================= */

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #f8fafc;
        color: #475569;
        font-size: 13px;
        text-align: left;
        padding: 13px;
        border-bottom: 1px solid #e2e8f0;
      }

      td {
        padding: 13px;
        border-bottom: 1px solid #e2e8f0;
        font-size: 14px;
      }

      tr:hover td {
        background: #f8fafc;
      }

      /* ================= PARKING ================= */

      .area {
        margin-bottom: 28px;
      }

      .area-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 13px;
      }

      .area-name {
        font-size: 17px;
        font-weight: bold;
      }

      .area-description {
        color: #64748b;
        font-size: 13px;
        margin-top: 3px;
      }

      /* ================= BADGE ================= */

      .badge {
        display: inline-block;
        padding: 5px 9px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
      }

      .badge-green {
        background: #dcfce7;
        color: #15803d;
      }

      .badge-red {
        background: #fee2e2;
        color: #b91c1c;
      }

      .badge-yellow {
        background: #fef3c7;
        color: #b45309;
      }

        .badge-gray {
          background: #e2e8f0;
          color: #334155;
        }

      /* ================= MODAL ================= */

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 15px;
      }

      .modal.show {
        display: flex;
      }

      .modal-box {
        width: 450px;
        max-width: 100%;
        background: white;
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        max-height: 90vh;
        overflow-y: auto;
      }

      .modal-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .modal-feedback {
        margin-top: 16px;
        padding: 12px 14px;
        border: 1px solid #fecaca;
        border-radius: 12px;
        background: #fef2f2;
        color: #b91c1c;
        font-size: 13px;
        line-height: 1.5;
      }

      .modal-feedback[hidden] {
        display: none;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        font-size: 14px;
      }

      .form-control {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        outline: none;
      }

      .form-control:focus {
        border-color: #2563eb;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }

      .ai-launcher {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 1100;
        border: 0;
        border-radius: 999px;
        padding: 13px 17px;
        background: #0f766e;
        color: white;
        font-weight: 700;
        box-shadow: 0 10px 24px rgba(15, 118, 110, 0.28);
      }

      .ai-launcher:hover {
        background: #115e59;
      }

      .ai-panel {
        position: fixed;
        right: 24px;
        bottom: 82px;
        z-index: 1100;
        display: none;
        width: min(390px, calc(100vw - 30px));
        height: min(590px, calc(100vh - 110px));
        overflow: hidden;
        flex-direction: column;
        background: white;
        border: 1px solid #cbd5e1;
        border-radius: 14px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.24);
      }

      .ai-panel.show {
        display: flex;
      }

      .ai-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 17px;
        background: #115e59;
        color: white;
      }

      .ai-header strong {
        font-size: 16px;
      }

      .ai-close {
        border: 0;
        background: transparent;
        color: white;
        font-size: 22px;
        line-height: 1;
      }

      .ai-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        background: #f8fafc;
      }

      .ai-message {
        max-width: 88%;
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        white-space: pre-wrap;
        line-height: 1.45;
        font-size: 14px;
      }

      .ai-message.assistant {
        margin-right: auto;
        background: white;
        border: 1px solid #e2e8f0;
        color: #334155;
      }

      .ai-message.user {
        margin-left: auto;
        background: #ccfbf1;
        color: #134e4a;
      }

      .ai-quick-actions {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding: 10px 12px 0;
        background: #f8fafc;
      }

      .ai-quick-actions button {
        flex: 0 0 auto;
        border: 1px solid #99f6e4;
        border-radius: 999px;
        padding: 6px 9px;
        background: white;
        color: #115e59;
        font-size: 12px;
      }

      .ai-form {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #e2e8f0;
        background: white;
      }

      .ai-form input {
        min-width: 0;
        flex: 1;
      }

      .ai-send {
        width: 42px;
        border: 0;
        border-radius: 8px;
        background: #0f766e;
        color: white;
        font-size: 18px;
      }

      /* ================= EMPTY ================= */

      .empty {
        text-align: center;
        padding: 40px 20px;
        color: #64748b;
      }
      /* ================= FIX PARKING UI ================= */

      .area {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 22px;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
      }

      .area-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 16px;
      }

      .area-info {
        min-width: 0;
      }

      .area-name {
        font-size: 20px;
        font-weight: 700;
        color: #172554;
      }

      .area-description {
        color: #64748b;
        font-size: 14px;
        margin-top: 5px;
      }

      .area-count {
        display: inline-block;
        margin-top: 8px;
        padding: 5px 10px;
        background: #eff6ff;
        color: #2563eb;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }

      .area-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .parking-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(130px, 1fr));
        gap: 14px;
      }

      .slot {
        --slot-accent: #475569;
        --slot-soft: #f1f5f9;
        --slot-border: #cbd5e1;
        min-height: 154px;
        border-radius: 12px;
        border: 1px solid var(--slot-border);
        border-top: 4px solid var(--slot-accent);
        padding: 13px;
        color: #172033;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 12px;
        background: #fff;
        box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);
        transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
        cursor: pointer;
      }

      .slot.available {
        --slot-accent: #15803d;
        --slot-soft: #dcfce7;
        --slot-border: #86efac;
      }

      .slot.occupied {
        --slot-accent: #be123c;
        --slot-soft: #ffe4e6;
        --slot-border: #fda4af;
      }

      .slot.reserved {
        --slot-accent: #b45309;
        --slot-soft: #fef3c7;
        --slot-border: #fcd34d;
      }

      .slot.inactive {
        --slot-accent: #475569;
        --slot-soft: #e2e8f0;
        --slot-border: #cbd5e1;
      }

      .slot:hover,
      .slot:focus-within {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(15, 23, 42, 0.12);
      }

      .slot-code {
        font-size: 23px;
        font-weight: 800;
        line-height: 1.1;
        color: #111827;
      }

      .slot-status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: fit-content;
        margin-top: 9px;
        padding: 5px 8px;
        border-radius: 6px;
        background: var(--slot-soft);
        color: var(--slot-accent);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
      }

      .slot-status-symbol {
        display: inline-grid;
        place-items: center;
        width: 16px;
        height: 16px;
        border: 1px solid currentColor;
        border-radius: 50%;
        font-size: 10px;
        line-height: 1;
      }

      .slot-vehicle {
        margin-top: 8px;
        color: #475569;
        font-size: 12px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .slot-actions {
        display: flex;
        gap: 6px;
        margin-top: auto;
      }

      .slot-actions button {
        display: inline-grid;
        place-items: center;
        width: 32px;
        height: 30px;
        border: 1px solid #e2e8f0;
        border-radius: 7px;
        background: #f8fafc;
        color: #334155;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      .slot-actions button:hover {
        border-color: var(--slot-border);
        background: var(--slot-soft);
        color: var(--slot-accent);
      }

      .slot-empty {
        grid-column: 1 / -1;
        min-height: 120px;
        border: 1px dashed #cbd5e1;
        background: #f8fafc;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        color: #64748b;
      }

      .ticket-summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 22px;
      }

      .chart-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        margin-top: 22px;
      }

      .chart-card {
        min-width: 0;
        background: linear-gradient(160deg, #fff 0%, #fbfdff 100%);
        border: 1px solid #e6edf7;
        border-radius: 19px;
        padding: 20px;
        box-shadow: 0 5px 16px rgba(18, 38, 71, 0.04);
      }

      .chart-card h3 {
        margin-bottom: 18px;
        font-size: 16px;
        color: #1d2b45;
        letter-spacing: -0.015em;
      }

      .line-chart {
        display: block;
        width: 100%;
        height: auto;
        min-height: 195px;
        overflow: visible;
      }

      .chart-gridline {
        stroke: #e9eef6;
        stroke-width: 1;
      }

      .chart-axis-label {
        fill: #8491a6;
        font-family: Arial, sans-serif;
        font-size: 11px;
      }

      .chart-area {
        opacity: 0.16;
      }

      .chart-line {
        fill: none;
        stroke: #3478f6;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
        transition: stroke-width 180ms ease;
      }

      .chart-line.chart-line-teal {
        stroke: #10a786;
      }

      .chart-point {
        cursor: pointer;
        outline: none;
      }

      .chart-point circle {
        fill: #fff;
        stroke: #3478f6;
        stroke-width: 3;
        vector-effect: non-scaling-stroke;
        transition: r 150ms ease, stroke-width 150ms ease;
      }

      .chart-point.chart-point-teal circle {
        stroke: #10a786;
      }

      .chart-point:hover circle,
      .chart-point:focus circle {
        r: 6;
        stroke-width: 4;
      }

      .chart-card:hover .chart-line {
        stroke-width: 3.5;
      }

      .chart-tooltip {
        fill: #172033;
        font-family: Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
      }

      .workflow-panel {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
      }

      .workflow-step {
        background: linear-gradient(160deg, #f8fbff 0%, #fff 80%);
        border: 1px solid #e6edf7;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 6px 20px rgba(18, 38, 71, 0.045);
        transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
      }

      .workflow-step:hover {
        border-color: #cbdcf7;
        box-shadow: 0 12px 28px rgba(18, 38, 71, 0.08);
        transform: translateY(-2px);
      }

      .workflow-step .step-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: linear-gradient(145deg, #eaf2ff, #dceaff);
        color: #2563eb;
        margin-bottom: 15px;
      }

      .workflow-step .step-icon svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .workflow-step h4 {
        font-size: 15px;
        line-height: 1.4;
        margin-bottom: 8px;
      }

      .workflow-step p {
        color: #64748b;
        line-height: 1.5;
        font-size: 13px;
        margin-bottom: 0;
      }

      .workflow-actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        flex-wrap: wrap;
      }

      .pricing-guide {
        margin: 0 0 16px;
        padding: 14px 16px;
        border: 1px solid #bfdbfe;
        border-radius: 14px;
        background: #eff6ff;
        color: #1e3a8a;
        font-size: 13px;
        line-height: 1.55;
      }

      .pricing-guide strong {
        color: #1d4ed8;
      }

      .price-duration {
        display: grid;
        gap: 3px;
      }

      .price-duration small {
        color: #64748b;
      }

      .price-status {
        display: inline-flex;
        padding: 5px 9px;
        border-radius: 999px;
        background: #dcfce7;
        color: #166534;
        font-size: 12px;
        font-weight: 700;
      }

      .price-status.inactive {
        background: #f1f5f9;
        color: #64748b;
      }

      .mini-list {
        display: grid;
        gap: 10px;
      }

      .mini-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 9px 10px;
        border-radius: 10px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
      }

      .mini-row span {
        color: #475569;
        font-size: 12px;
      }

      .mini-row strong {
        color: #0f172a;
        font-size: 14px;
      }

      .overview-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
        gap: 18px;
        margin-bottom: 20px;
      }

      .overview-card {
        background: linear-gradient(135deg, #f8fbff 0%, #ffffff 100%);
        border: 1px solid #dbeafe;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 10px 24px rgba(59, 130, 246, 0.08);
      }

      .overview-card.primary {
        background: linear-gradient(135deg, #eff6ff 0%, #ffffff 52%, #ecfeff 100%);
      }

      .overview-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .overview-kpi {
        font-size: 12px;
        color: #475569;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .overview-number {
        font-size: 36px;
        font-weight: 800;
        line-height: 1.1;
        color: #0f172a;
      }

      .overview-trend {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: #dcfce7;
        color: #166534;
        font-size: 12px;
        font-weight: 700;
      }

      .spark-bars {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        align-items: end;
        gap: 8px;
        height: 110px;
        margin-top: 12px;
      }

      .spark-bars span {
        display: block;
        border-radius: 10px 10px 0 0;
        background: linear-gradient(180deg, #60a5fa, #2563eb);
        opacity: 0.88;
      }

      .insight-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .insight-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
      }

      .insight-label {
        color: #475569;
        font-size: 13px;
      }

      .insight-value {
        font-size: 15px;
        font-weight: 800;
        color: #0f172a;
      }

      .parking-filters {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        gap: 10px;
        margin-bottom: 18px;
      }

      .mini-card {
        background: #fff;
        border: 1px solid #e7edf5;
        border-radius: 17px;
        padding: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 14px rgba(18, 38, 71, 0.035);
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .mini-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(18, 38, 71, 0.08);
      }

      .mini-card span {
        color: #64748b;
      }

      .mini-card strong {
        font-size: 24px;
        color: #1c376b;
        text-align: right;
      }

      .error-panel {
        border-color: #fecaca;
        background: #fffafa;
      }

      .area-stat-list {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        overflow: hidden;
      }

      .area-stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px;
        border-bottom: 1px solid #e2e8f0;
      }

      .area-stat-row:last-child {
        border-bottom: 0;
      }

      .area-stat-values {
        display: flex;
        gap: 16px;
      }

      .text-green {
        color: #15803d !important;
      }

      .text-red {
        color: #b91c1c !important;
      }
      /* ================= RESPONSIVE ================= */

      @media (max-width: 1000px) {
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .parking-grid {
          grid-template-columns: repeat(3, 1fr);
        }

        .chart-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 700px) {
        .overview-grid {
          grid-template-columns: minmax(0, 1fr);
        }

        .sidebar {
          display: none;
        }

        .content {
          padding: 15px;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .parking-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .parking-filters {
          grid-template-columns: 1fr;
        }

        .header {
          padding: 0 15px;
        }

        .user-info {
          gap: 8px;
          font-size: 13px;
        }

        .stats {
          gap: 10px;
        }

        .stat-card {
          min-height: 112px;
          padding: 15px;
          border-radius: 16px;
        }

        .stat-icon {
          width: 32px;
          height: 32px;
          border-radius: 10px;
          font-size: 15px;
        }

        .stat-number {
          margin-top: 10px;
        }

        .ticket-summary,
        .workflow-panel {
          grid-template-columns: 1fr;
        }

        .chart-card {
          padding: 15px;
        }

        .chart-axis-label {
          font-size: 10px;
        }

        .ai-launcher {
          right: 15px;
          bottom: 15px;
        }

        .ai-panel {
          right: 15px;
          bottom: 70px;
          height: min(560px, calc(100vh - 90px));
        }
      }

      :root {
        --app-page: #edf0f2;
        --app-surface: #ffffff;
        --app-soft: #f4f6f7;
        --app-line: #d5dde1;
        --app-ink: #202a30;
        --app-muted: #637078;
        --app-brand: #29343a;
        --app-brand-hover: #19252b;
        --app-brand-soft: #e7ecee;
        --app-amber: #c8661d;
        --app-red: #bb414a;
      }

      body {
        background: var(--app-page);
        color: var(--app-ink);
        font-family: "Segoe UI", Aptos, sans-serif;
      }

      .header {
        background: #252c30;
        border-bottom: 3px solid #d46f2b;
        box-shadow: 0 3px 12px rgba(27, 38, 43, 0.14);
      }

      .logo {
        letter-spacing: 0;
      }

      .logout {
        border-radius: 7px;
        background: #b84348;
      }

      .logout:hover {
        background: #9e343a;
      }

      .sidebar {
        background: #f8f9f9;
        border-right-color: var(--app-line);
      }

      .menu-title {
        color: #7b858b;
        letter-spacing: 0.06em;
      }

      .menu-item {
        border-radius: 7px;
        color: #4a565d;
      }

      .menu-item:hover {
        background: #eef1f2;
        color: var(--app-brand);
        transform: none;
      }

      .menu-item.active {
        background: #fcecdf;
        color: var(--app-brand);
        box-shadow: inset 3px 0 #d46f2b;
      }

      .content {
        background: var(--app-page);
      }

      .content.overview-mode > .stats,
      .content.statistics-mode > .stats {
        display: none;
      }

      .page-title {
        color: #202a30;
        letter-spacing: 0;
      }

      .subtitle {
        color: var(--app-muted);
      }

      .stat-card,
      .statistics-board .stat-card {
        border-color: var(--app-line);
        border-radius: 6px;
        box-shadow: 0 1px 3px rgba(27, 38, 43, 0.045);
      }

      .stat-icon,
      .statistics-board .stat-icon {
        border-radius: 5px;
      }

      .statistics-heading {
        border-bottom-color: var(--app-line);
      }

      .statistics-kicker {
        color: var(--app-brand);
        letter-spacing: 0;
      }

      .statistics-board .stat-card[data-tone="green"] {
        --stat-accent: #1a806e;
        --stat-soft: #e3f2ef;
      }

      .statistics-board .stat-card[data-tone="rose"] {
        --stat-accent: #bd4650;
        --stat-soft: #f8e9eb;
      }

      .statistics-board .stat-card[data-tone="amber"] {
        --stat-accent: #c8661d;
        --stat-soft: #fcecdf;
      }

      .statistics-board .stat-card[data-tone="teal"] {
        --stat-accent: #147c8b;
        --stat-soft: #e2f0f2;
      }

      .statistics-board .stat-card[data-tone="blue"] {
        --stat-accent: #3c728e;
        --stat-soft: #e7eff3;
      }

      .statistics-board .stat-card[data-tone="slate"] {
        --stat-accent: #59656b;
        --stat-soft: #edf0f1;
      }

      .statistics-heading h2,
      .statistics-section-head h3 {
        color: #28343a;
        letter-spacing: 0;
      }

      .statistics-source {
        border-color: var(--app-line);
        border-radius: 6px;
        color: var(--app-muted);
      }

      .panel {
        border-color: var(--app-line);
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(27, 38, 43, 0.045);
      }

      .panel-title {
        color: #28343a;
        letter-spacing: 0;
      }

      .btn {
        border-radius: 6px;
        transition: background-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
      }

      .btn:focus-visible,
      .menu-item:focus-visible,
      .logout:focus-visible,
      .ai-launcher:focus-visible {
        outline: 3px solid #e28a3f;
        outline-offset: 2px;
      }

      .btn-primary {
        background: var(--app-brand);
      }

      .btn-primary:hover {
        background: var(--app-brand-hover);
      }

      .btn-success {
        background: #197968;
      }

      .btn-warning {
        background: #c8661d;
        color: #fff;
      }

      .btn-warning:hover {
        background: #a95112;
      }

      .btn-danger {
        background: var(--app-red);
      }

      .btn-danger:hover {
        background: #98353d;
      }

      .btn-gray {
        background: #e7ecee;
        color: #3e4b51;
      }

      .table-wrapper {
        border: 1px solid var(--app-line);
        border-radius: 8px;
        background: var(--app-surface);
      }

      th {
        background: #e9eef0;
        color: #3f4e55;
        border-bottom-color: #d5dde1;
      }

      td {
        color: #2e3a40;
        border-bottom-color: #e5e9eb;
      }

      tr:hover td {
        background: #f5f7f8;
      }

      .form-control {
        border-color: #cbd5da;
        border-radius: 7px;
        background: #fff;
        color: var(--app-ink);
      }

      .form-control:focus {
        border-color: #d46f2b;
        box-shadow: 0 0 0 3px rgba(212, 111, 43, 0.14);
      }

      .modal {
        background: rgba(25, 37, 43, 0.52);
      }

      .modal-box {
        border: 1px solid var(--app-line);
        border-radius: 8px;
        box-shadow: 0 18px 50px rgba(25, 37, 43, 0.2);
      }

      .modal-title {
        color: #28343a;
      }

      .area {
        border-color: var(--app-line);
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(27, 38, 43, 0.04);
      }

      .area-name {
        color: #28343a;
      }

      .area-count {
        background: var(--app-brand-soft);
        color: var(--app-brand);
        border-radius: 4px;
      }

      .slot {
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(27, 38, 43, 0.045);
      }

      .slot:hover,
      .slot:focus-within {
        box-shadow: 0 5px 13px rgba(27, 38, 43, 0.11);
      }

      .slot-status-badge {
        border-radius: 4px;
      }

      .chart-card,
      .overview-card,
      .workflow-step {
        border-color: var(--app-line);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 1px 4px rgba(27, 38, 43, 0.04);
      }

      .chart-card h3,
      .workflow-step h4 {
        color: #28343a;
        letter-spacing: 0;
      }

      .chart-gridline {
        stroke: #dce2e5;
      }

      .chart-line,
      .chart-point circle {
        stroke: #3c728e;
      }

      .chart-line.chart-line-teal,
      .chart-point.chart-point-teal circle {
        stroke: #d46f2b;
      }

      .workflow-step:hover {
        border-color: #e6b98f;
        box-shadow: 0 5px 12px rgba(27, 38, 43, 0.08);
        transform: translateY(-1px);
      }

      .workflow-step .step-icon {
        border-radius: 6px;
        background: #fcecdf;
        color: #a95112;
      }

      .pricing-guide {
        border-color: #efd0b5;
        border-radius: 6px;
        background: #fff5ec;
        color: #594635;
      }

      .pricing-guide strong {
        color: var(--app-brand);
      }

      .price-status {
        border-radius: 6px;
        background: #e1f1ec;
        color: #176957;
      }

      .price-status.inactive {
        background: #edf0f1;
        color: #5e6a70;
      }

      .mini-row {
        border-color: var(--app-line);
        border-radius: 5px;
        background: var(--app-soft);
      }

      .overview-card.primary {
        background: #f3f5f6;
      }

      .overview-trend {
        border-radius: 5px;
        background: #e1f1ec;
        color: #176957;
      }

      .spark-bars span {
        background: #487a91;
      }

      .ai-launcher,
      .ai-send {
        border-radius: 6px;
        background: #d46f2b;
        box-shadow: 0 4px 12px rgba(145, 75, 26, 0.22);
      }

      .ai-launcher:hover,
      .ai-send:hover {
        background: #b75a1b;
      }

      .ai-panel {
        border-color: var(--app-line);
        border-radius: 8px;
        box-shadow: 0 12px 32px rgba(25, 37, 43, 0.2);
      }

      .ai-header {
        background: #252c30;
        border-bottom: 3px solid #d46f2b;
      }

      .ai-messages,
      .ai-quick-actions {
        background: #f1f3f4;
      }

      .ai-message {
        border-radius: 8px;
      }

      .ai-message.assistant {
        border-color: var(--app-line);
        color: #35473d;
      }

      .ai-message.user {
        background: #fcecdf;
        color: #75441f;
      }

      .ai-quick-actions button {
        border-color: #d5dde1;
        border-radius: 5px;
        color: #3c535e;
      }

      .ai-form {
        border-top-color: var(--app-line);
      }

      .overview-dashboard {
        display: grid;
        gap: 18px;
        min-width: 0;
      }

      .overview-section-heading,
      .overview-card-heading,
      .overview-area-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .overview-welcome {
        position: relative;
        display: flex;
        align-items: center;
        min-height: 225px;
        overflow: hidden;
        border: 1px solid #48545a;
        border-radius: 8px;
        padding: 28px 32px;
        background-color: #252c30;
        background-image:
          linear-gradient(90deg, rgba(28, 35, 39, 0.94) 0%, rgba(28, 35, 39, 0.82) 43%, rgba(28, 35, 39, 0.18) 100%),
          url("https://images.unsplash.com/photo-1506521781263-d8422e82f27a?auto=format&fit=crop&w=1600&q=85");
        background-position: center, center 54%;
        background-size: cover;
        color: #fff;
      }

      .overview-welcome-copy {
        position: relative;
        z-index: 1;
        max-width: 610px;
      }

      .overview-welcome .overview-eyebrow {
        color: #ffc18e;
      }

      .overview-welcome h2 {
        margin: 0;
        color: #fff;
        font-size: 30px;
        line-height: 1.18;
      }

      .overview-welcome h2 span {
        color: #ffc18e;
      }

      .overview-welcome-copy > p:not(.overview-eyebrow) {
        max-width: 470px;
        margin-top: 9px;
        color: #e2e7e9;
        font-size: 13px;
        line-height: 1.5;
      }

      .overview-welcome-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 17px;
      }

      .overview-welcome .btn-primary {
        background: #d46f2b;
      }

      .overview-welcome .btn-primary:hover {
        background: #b75a1b;
      }

      .overview-welcome .btn-outline {
        border: 1px solid rgba(255, 255, 255, 0.6);
        background: rgba(32, 40, 44, 0.36);
        color: #fff;
      }

      .overview-welcome .btn-outline:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .overview-welcome-status {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 10px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 5px;
        background: rgba(29, 37, 41, 0.7);
        color: #f3f5f6;
        font-size: 10px;
        font-weight: 700;
      }

      .overview-live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #6bc0aa;
      }

      .overview-metric-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .overview-metric-card {
        min-width: 0;
        padding: 13px 15px;
        border: 1px solid var(--app-line);
        border-top: 3px solid #54636a;
        border-radius: 6px;
        background: #fff;

      .overview-metric-card[data-tone="teal"] {

  <body>
    <header class="header">

    <div class="layout">
      <aside class="sidebar">
        <div class="menu-title">QUẢN LÝ</div>

        <button
          class="menu-item active"
          id="menuOverview"
          onclick="showOverview()">

        <button
          class="menu-item"
          id="menuParking"
          onclick="showParking()"
        >

        </button>

        <button class="menu-item" id="menuVehicles" onclick="showVehicles()">
          🚗 Phương tiện
        </button>

        <button class="menu-item" id="menuEmployees" onclick="showEmployees()" hidden>
          👥 Nhân viên
        </button>

        <button class="menu-item" id="menuTickets" onclick="showTickets()">
          🎫 Vé xe
        </button>

        <button class="menu-item" id="menuPrices" onclick="showPrices()">
          💵 Bảng giá
        </button>

        <button class="menu-item" id="menuRevenue" onclick="showRevenue()">

        </button>

        <div class="menu-title">PHÂN TÍCH</div>

      <main class="content">
        <h1 class="page-title" id="pageTitle">Tổng quan</h1>

        <section class="stats">
          <div class="stat-card">
            <div class="stat-card-head">
              <div class="stat-label">Tổng vị trí</div>
              <span class="stat-icon stat-icon--blue" aria-hidden="true">P</span>
            </div>
            <div class="stat-number" id="totalSlots">--</div>
          </div>

          <div class="stat-card">
            <div class="stat-card-head">
              <div class="stat-label">Chỗ trống</div>
              <span class="stat-icon stat-icon--green" aria-hidden="true">✓</span>
            </div>
            <div class="stat-number" id="availableSlots">--</div>
          </div>

          <div class="stat-card">
            <div class="stat-card-head">
              <div class="stat-label">Đang đỗ</div>
              <span class="stat-icon stat-icon--rose" aria-hidden="true">●</span>
            </div>
            <div class="stat-number" id="occupiedSlots">--</div>
          </div>

          <div class="stat-card">
            <div class="stat-card-head">
              <div class="stat-label">Đã giữ</div>
              <span class="stat-icon stat-icon--amber" aria-hidden="true">!</span>
            </div>
            <div class="stat-number" id="reservedSlots">--</div>

        <div id="mainContent"></div>

    <div class="modal" id="modal">
      <div class="modal-box">
        <div class="modal-title" id="modalTitle">Thao tác</div>

        <div id="modalBody"></div>
        <div id="modalFeedback" class="modal-feedback" role="alert" aria-live="polite" hidden></div>

        <div class="modal-actions">
          <button class="btn btn-gray" onclick="closeModal()">Hủy</button>

          <button
            class="btn btn-primary"
            id="modalSaveButton"
          onclick="saveModalWithFeedback()"
          >
            Lưu
          </button>
        </div>
      </div>
    </div>

    <button
      class="ai-launcher"
      id="aiLauncher"
      type="button"
      onclick="toggleAiChat()"
      aria-controls="aiPanel"
      aria-expanded="false">
      🤖 Parking
    </button>

    <section class="ai-panel" id="aiPanel" aria-label="Parking Assistant">
      <header class="ai-header">
        <strong>🤖 Parking</strong>
        <button class="ai-close" type="button" onclick="toggleAiChat()" aria-label="Đóng trợ lý">×</button>
      </header>

      <div class="ai-messages" id="aiMessages" role="log" aria-live="polite">
        <div class="ai-message assistant">
          Xin chào! Tôi có thể giúp bạn phân tích dữ liệu bãi đỗ hiện tại.
        </div>
      </div>

      <div class="ai-quick-actions" aria-label="Câu hỏi nhanh">
        <button type="button" onclick="askAi('Bãi còn bao nhiêu chỗ?')">Chỗ trống?</button>
        <button type="button" onclick="askAi('Doanh thu hôm nay bao nhiêu?')">Doanh thu hôm nay?</button>
        <button type="button" onclick="askAi('Bãi đang sử dụng bao nhiêu phần trăm công suất?')">Công suất?</button>
        <button type="button" onclick="askAi('Báo cáo lưu lượng xe tuần này theo ngày')">Lưu lượng tuần</button>
        <button type="button" onclick="askAi('Khung giờ nào đông nhất tuần này?')">Giờ cao điểm</button>
        <button type="button" onclick="askAi('Gợi ý bố trí nhân sự tuần này')">Gợi ý nhân sự</button>
      </div>

      <form class="ai-form" id="aiForm">
        <input id="aiInput" type="text" placeholder="Nhập câu hỏi..." autocomplete="off" aria-label="Câu hỏi cho Parking">
        <button class="ai-send" type="submit" aria-label="Gửi câu hỏi">➤</button>
      </form>
    </section>

    <script>
            let modalMode = null;
            let selectedId = null;
            let selectedAreaId = null;
            let parkingAreaData = [];
            let statsTimer = null;
            let currentUserId = null;
            let currentFullName = "";
            let currentProfilePromise = null;

            const token = () => localStorage.getItem("access_token");
            function updateStats(total, available, occupied, reserved) {
              document.getElementById("totalSlots").textContent = Number(total || 0);
              document.getElementById("availableSlots").textContent = Number(available || 0);
              document.getElementById("occupiedSlots").textContent = Number(occupied || 0);
              document.getElementById("reservedSlots").textContent = Number(reserved || 0);
            }

            async function refreshStats() {
              try {
                const data = await api("/api/dashboard/summary");
                updateStats(
                  data.total_slots,
                  data.available_slots,
                  data.occupied_slots,
                  data.reserved_slots,
                );
              } catch (error) {
                console.error("Không thể tải chỉ số tổng quan:", error);
              }
            }

            function filterParking() {
              const query = (
                document.getElementById("parkingSearch")?.value || ""
              ).trim().toLowerCase();
              const status =
                document.getElementById("parkingStatusFilter")?.value || "";
              const areaId =
                document.getElementById("parkingAreaFilter")?.value || "";

              document.querySelectorAll(".area[data-area-id]").forEach((area) => {
                const matchesArea = !areaId || area.dataset.areaId === areaId;
                let visibleSlots = 0;

                area.querySelectorAll(".slot").forEach((slot) => {
                  const matchesQuery = !query || [
                    slot.dataset.slotCode,
                    slot.dataset.vehicleType,
                    slot.textContent,
                  ].some((value) => value.toLowerCase().includes(query));
                  const matchesStatus = !status || slot.dataset.status === status;
                  const visible = matchesArea && matchesQuery && matchesStatus;

                  slot.style.display = visible ? "" : "none";
                  if (visible) {
                    visibleSlots += 1;
                  }
                });

                area.style.display = matchesArea && (visibleSlots > 0 || !query && !status)
                  ? ""
                  : "none";
              });
            }

            function filterRows(inputId, rowSelector) {
              const query = (
                document.getElementById(inputId)?.value || ""
              ).trim().toLowerCase();

              document.querySelectorAll(rowSelector).forEach((row) => {
                row.style.display = row.textContent.toLowerCase().includes(query)
                  ? ""
                  : "none";
              });
            }

            function apiError(data) {
              if (!data) {
                return "Máy chủ không trả về thông tin lỗi";
              }

              if (typeof data === "string") {
                return data;
              }

              if (typeof data.detail === "string") {
                return data.detail;
              }

              if (Array.isArray(data.detail)) {
                return data.detail
                  .map((item) => {
                    if (typeof item === "string") {
                      return item;
                    }

                    if (item.msg) {
                      return item.msg;
                    }

                    return JSON.stringify(item);
                  })
                  .join("\n");
              }

              if (data.message) {
                return data.message;
              }

              return Object.keys(data).length ? JSON.stringify(data) : "Máy chủ trả về lỗi nhưng không có nội dung chi tiết";
            }

            async function api(url, options = {}) {
              const response = await fetch(url, {
                ...options,

                headers: {
                  ...(options.headers || {}),
                  Authorization: "Bearer " + token(),
                },
              });

              const responseText = await response.text();
              let data = {};
              if (responseText) {
                try {
                  data = JSON.parse(responseText);
                } catch {
                  data = responseText;
                }
              }

              if (response.status === 401) {
                localStorage.removeItem("access_token");
                localStorage.removeItem("username");

                window.location.href = "/login";

                throw new Error("Phiên đăng nhập đã hết hạn");
              }

              if (!response.ok) {
                const detail = apiError(data);
                throw new Error(
                  `HTTP ${response.status}${response.statusText ? ` ${response.statusText}` : ""}: ${detail}`,
                );
              }

              return data;
            }

            function toggleAiChat() {
              const panel = document.getElementById("aiPanel");
              const launcher = document.getElementById("aiLauncher");
              const isOpen = panel.classList.toggle("show");

              launcher.setAttribute("aria-expanded", String(isOpen));
              if (isOpen) {
                document.getElementById("aiInput").focus();
              }
            }

            function appendAiMessage(role, message) {
              const messages = document.getElementById("aiMessages");
              const item = document.createElement("div");
              item.className = `ai-message ${role}`;
              item.textContent = message;
              messages.appendChild(item);
              messages.scrollTop = messages.scrollHeight;
              return item;
            }

            async function askAi(question) {
              const input = document.getElementById("aiInput");
              const text = (question || input.value).trim();
              if (!text) {
                return;
              }

              input.value = "";
              appendAiMessage("user", text);
              const loading = appendAiMessage("assistant", "Đang đọc dữ liệu bãi đỗ...");

              try {
                const result = await api("/api/ai/assistant", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({ question: text }),
                });
                loading.textContent = result.answer || "Không có dữ liệu trả lời.";
              } catch (error) {
                loading.textContent = error.message || "Không thể truy vấn dữ liệu bãi đỗ.";
              }
            }

            function escapeHtml(value) {
              const div = document.createElement("div");

              div.textContent = value ?? "";

              return div.innerHTML;
            }

            function setMenu(id) {
              document
                .querySelectorAll(".menu-item")
                .forEach((x) => x.classList.remove("active"));

              document
                .querySelector(".content")
                ?.classList.toggle("overview-mode", id === "menuOverview");

              document
                .querySelector(".content")
                ?.classList.toggle("statistics-mode", id === "menuStatistics");

              if (id) {
                document.getElementById(id)?.classList.add("active");
              }
            }

            function openModal(title, body, mode) {
              modalMode = mode;

              document.getElementById("modalTitle").textContent = title;

              document.getElementById("modalBody").innerHTML = body;
              clearModalFeedback();
              document.getElementById("modalSaveButton").style.display =
                mode === "viewSlot" ? "none" : "";

              document.getElementById("modal").classList.add("show");
            }

            function showModalFeedback(message) {
              const feedback = document.getElementById("modalFeedback");
              feedback.textContent = message;
              feedback.hidden = false;
            }

            function clearModalFeedback() {
              const feedback = document.getElementById("modalFeedback");
              feedback.textContent = "";
              feedback.hidden = true;
            }

            function closeModal() {
              document.getElementById("modal").classList.remove("show");

              modalMode = null;
              selectedId = null;
              selectedAreaId = null;
              document.getElementById("modalSaveButton").style.display = "";
            }

            function startLiveDashboard() {
              if (statsTimer) {
                clearInterval(statsTimer);
              }

              refreshStats();
              statsTimer = setInterval(() => {
                refreshStats();
                if (document.getElementById("menuOverview")?.classList.contains("active")) {
                  showOverview(true);
                }
              }, 10000);
            }

            async function loadCurrentProfile() {
              if (!currentProfilePromise) {
                currentProfilePromise = api("/api/auth/me")
                  .then((profile) => {
                    currentUserId = Number(profile.id) || null;
                    currentFullName = String(profile.full_name || profile.username || "").trim();
                    document.getElementById("username").textContent = currentFullName || "Quản trị viên";
                    return profile;
                  })
                  .catch((error) => {
                    currentProfilePromise = null;
                    throw error;
                  });
              }
              return currentProfilePromise;
            }

            async function configureAdminMenu() {
              const employeeMenu = document.getElementById("menuEmployees");
              const auditMenu = document.getElementById("menuAuditLogs");
              try {
                const profile = await loadCurrentProfile();
                const isAdmin = String(profile.role || "").toUpperCase() === "ADMIN";
                employeeMenu.hidden = !isAdmin;
                auditMenu.hidden = !isAdmin;
              } catch {
                employeeMenu.hidden = true;
                auditMenu.hidden = true;
              }
            }

            async function showOverview(backgroundRefresh = false) {
              if (!backgroundRefresh) {
                setMenu("menuOverview");
              } else if (!document.getElementById("menuOverview")?.classList.contains("active")) {
                return;
              }
              if (!backgroundRefresh) {
                refreshStats();
              }

              document.getElementById("pageTitle").textContent = "Tổng quan";
              document.getElementById("pageSubtitle").textContent =
                "Tình hình vận hành bãi đỗ xe";

              const content = document.getElementById("mainContent");
              if (!content.querySelector(".overview-dashboard")) {
                content.innerHTML = `
                  <div class="panel"><div class="empty">Đang tải tổng quan vận hành...</div></div>
                `;
              }

              try {

            async function vehicleEntry() {
              try {
                const vehiclesData = await api("/api/vehicles/");
                const areasData = await api("/api/areas/");

                const vehicles = (Array.isArray(vehiclesData) ? vehiclesData : [])
                  .filter((vehicle) => vehicle.status !== "parking");

                const areas = Array.isArray(areasData) ? areasData : [];

                let slots = [];

                for (const area of areas) {
                  try {
                    const areaSlots = await api(`/api/areas/${area.id}/slots`);

                    if (Array.isArray(areaSlots)) {
                      slots.push(
                        ...areaSlots.filter((slot) => slot.status === "available"),
                      );
                    }
                  } catch (error) {
                    console.error(error);
                  }
                }

                if (vehicles.length === 0) {
                  alert(
                    "⚠️ Chưa có phương tiện.\n\n" +
                      "Hãy vào mục Phương tiện để thêm xe trước.",
                  );

                  return;
                }

                if (slots.length === 0) {
                  alert("⚠️ Hiện không còn vị trí trống.");

                  return;
                }

                openModal(
                  "🚗 Xe vào bãi",

                  `

                                    <div class="form-group">

                                        <label>Phương tiện</label>

                                        <select
                                            id="entryVehicle"
                                            class="form-control">

              if (!confirm("Xác nhận xe ra khỏi bãi?")) {

                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",

                  body: JSON.stringify({ ticket_id: ticketId }),

                const fee = Number(result?.fee || 0);

                alert(

                await loadParking();
                await showTickets();

                alert("❌ Không thể cho xe ra:\n" + error.message);

            function buildHourlyRevenueChart(tickets) {
              const summary = Array.from({ length: 24 }, (_, hour) => {
                const total = (Array.isArray(tickets) ? tickets : []).reduce((sum, ticket) => {
                  if (String(ticket.status || "").toUpperCase() !== "PAID") return sum;
                  const raw = ticket.exit_time || ticket.check_out;
                  if (!raw) return sum;
                  const date = parseAppDate(raw);
                  if (Number.isNaN(date.getTime()) || date.getHours() !== hour) return sum;
                  return sum + Number(ticket.fee || 0);
                }, 0);

                return {
                  label: `${hour}:00`,
                  value: total,
                };
              });

              return buildLineChart(summary, {
                id: "hourly-revenue",
                color: "blue",
                currency: true,
                description: "Doanh thu theo giờ",
                xLabelInterval: 3,
              });
            }
