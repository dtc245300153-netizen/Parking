<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <title>Parking - Quản lý bãi đỗ xe</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #172033;
      }

      button,
      input,
      select {
        font-family: inherit;
      }

      button {
        cursor: pointer;
      }

      .report-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: #e0f2fe;
        color: #0369a1;
        font-weight: 700;
        font-size: 12px;
        margin-bottom: 12px;
      }

      /* ================= HEADER ================= */

      .header {
        height: 68px;
        background: linear-gradient(110deg, #102247 0%, #1748a0 58%, #2563eb 100%);
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 8px 24px rgba(17, 36, 73, 0.16);
      }

      .logo {
        font-size: 21px;
        font-weight: bold;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logout {
        border: 0;
        background: #dc2626;
        color: white;
        padding: 9px 14px;
        border-radius: 9px;
        font-weight: 700;
      }

      .logout:hover {
        background: #b91c1c;
      }

      /* ================= LAYOUT ================= */

      .layout {
        display: flex;
        min-height: calc(100vh - 72px);
      }

      .sidebar {
        width: 248px;
        background: #fff;
        border-right: 1px solid #e2e8f0;
        padding: 22px 14px;
        flex-shrink: 0;
      }

      .menu-title {
        color: #94a3b8;
        font-size: 12px;
        font-weight: bold;
        margin: 15px 12px 8px;
      }

      .menu-item {
        width: 100%;
        border: 0;
        background: transparent;
        color: #475569;
        text-align: left;
        padding: 12px 14px;
        margin-bottom: 6px;
        border-radius: 11px;
        font-size: 14px;
        transition: color 160ms ease, background 160ms ease, transform 160ms ease;
      }

      .menu-item:hover {
        background: #f1f6ff;
        color: #2563eb;
        transform: translateX(2px);
      }

      .menu-item.active {
        background: #e8f0ff;
        color: #1b55c5;
        font-weight: bold;
        box-shadow: inset 3px 0 #3478f6;
      }

      /* ================= CONTENT ================= */

      .content {
        flex: 1;
        padding: 30px clamp(20px, 3vw, 46px);
        min-width: 0;
        max-width: 1720px;
      }

      .page-title {
        font-size: clamp(24px, 2.2vw, 31px);
        letter-spacing: -0.035em;
        margin-bottom: 7px;
      }

      .subtitle {
        color: #64748b;
        margin-bottom: 26px;
        line-height: 1.55;
      }

      /* ================= STATS ================= */

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        margin-bottom: 24px;
      }

      .stat-card {
        position: relative;
        min-height: 126px;
        background: #fff;
        border-radius: 20px;
        padding: 20px 21px;
        border: 1px solid #e8edf5;
        box-shadow: 0 5px 16px rgba(18, 38, 71, 0.045), 0 1px 3px rgba(18, 38, 71, 0.035);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 26px rgba(18, 38, 71, 0.09);
      }

      .stat-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .stat-label {
        color: #64748b;
        font-size: 13px;
        font-weight: 600;
      }

      .stat-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 13px;
        background: #eaf1ff;
        font-size: 18px;
      }

      .stat-number {
        font-size: clamp(26px, 2.3vw, 32px);
        line-height: 1.2;
        letter-spacing: -0.035em;
        font-weight: 750;
        margin-top: 15px;
        color: #15213a;
      }

      /* ================= PANEL ================= */

      .panel {
        background: #fff;
        border: 1px solid #e8edf5;
        border-radius: 22px;
        padding: clamp(18px, 2vw, 28px);
        margin-bottom: 22px;
        box-shadow: 0 8px 26px rgba(18, 38, 71, 0.055), 0 1px 3px rgba(18, 38, 71, 0.035);
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
      }

      .panel-title {
        font-size: 20px;
        font-weight: bold;
        letter-spacing: -0.02em;
      }

      /* ================= BUTTON ================= */

      .btn {
        border: 0;
        border-radius: 7px;
        padding: 9px 14px;
        font-weight: bold;
      }

      .btn-primary {
        background: #2563eb;
        color: white;
      }

      .btn-primary:hover {
        background: #1d4ed8;
      }

      .btn-success {
        background: #16a34a;
        color: white;
      }

      .btn-warning {
        background: #f59e0b;
        color: white;
      }

      .btn-danger {
        background: #dc2626;
        color: white;
      }

      .btn-gray {
        background: #e2e8f0;
        color: #334155;
      }

      .btn-small {
        padding: 7px 10px;
        font-size: 12px;
      }

      /* ================= TABLE ================= */

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #f8fafc;
        color: #475569;
        font-size: 13px;
        text-align: left;
        padding: 13px;
        border-bottom: 1px solid #e2e8f0;
      }

      td {
        padding: 13px;
        border-bottom: 1px solid #e2e8f0;
        font-size: 14px;
      }

      tr:hover td {
        background: #f8fafc;
      }

      /* ================= PARKING ================= */

      .area {
        margin-bottom: 28px;
      }

      .area-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 13px;
      }

      .area-name {
        font-size: 17px;
        font-weight: bold;
      }

      .area-description {
        color: #64748b;
        font-size: 13px;
        margin-top: 3px;
      }

      .parking-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }

      .slot {
        min-height: 105px;
        border-radius: 12px;
        padding: 14px;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: 0.15s;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 8px 18px rgba(15, 23, 42, 0.14);
      }

      .slot:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      }

      .slot.available {
        background: #16a34a;
      }

      .slot.occupied {
        background: #dc2626;
      }

      .slot.reserved {
        background: #d97706;
      }

        .slot.inactive {
          background: #475569;
        }

      .slot-code {
        font-size: 18px;
        font-weight: bold;
      }

      .slot-status {
        font-size: 13px;
      }

      .slot-actions {
        display: flex;
        gap: 5px;
      }

      .slot-actions button {
        border: 0;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border-radius: 5px;
        padding: 5px 7px;
        font-size: 11px;
      }

      /* ================= BADGE ================= */

      .badge {
        display: inline-block;
        padding: 5px 9px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
      }

      .badge-green {
        background: #dcfce7;
        color: #15803d;
      }

      .badge-red {
        background: #fee2e2;
        color: #b91c1c;
      }

      .badge-yellow {
        background: #fef3c7;
        color: #b45309;
      }

        .badge-gray {
          background: #e2e8f0;
          color: #334155;
        }

      /* ================= MODAL ================= */

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 15px;
      }

      .modal.show {
        display: flex;
      }

      .modal-box {
        width: 450px;
        max-width: 100%;
        background: white;
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        max-height: 90vh;
        overflow-y: auto;
      }

      .modal-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .modal-feedback {
        margin-top: 16px;
        padding: 12px 14px;
        border: 1px solid #fecaca;
        border-radius: 12px;
        background: #fef2f2;
        color: #b91c1c;
        font-size: 13px;
        line-height: 1.5;
      }

      .modal-feedback[hidden] {
        display: none;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        font-size: 14px;
      }

      .form-control {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        outline: none;
      }

      .form-control:focus {
        border-color: #2563eb;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }

      .ai-launcher {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 1100;
        border: 0;
        border-radius: 999px;
        padding: 13px 17px;
        background: #0f766e;
        color: white;
        font-weight: 700;
        box-shadow: 0 10px 24px rgba(15, 118, 110, 0.28);
      }

      .ai-launcher:hover {
        background: #115e59;
      }

      .ai-panel {
        position: fixed;
        right: 24px;
        bottom: 82px;
        z-index: 1100;
        display: none;
        width: min(390px, calc(100vw - 30px));
        height: min(590px, calc(100vh - 110px));
        overflow: hidden;
        flex-direction: column;
        background: white;
        border: 1px solid #cbd5e1;
        border-radius: 14px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.24);
      }

      .ai-panel.show {
        display: flex;
      }

      .ai-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 17px;
        background: #115e59;
        color: white;
      }

      .ai-header strong {
        font-size: 16px;
      }

      .ai-close {
        border: 0;
        background: transparent;
        color: white;
        font-size: 22px;
        line-height: 1;
      }

      .ai-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        background: #f8fafc;
      }

      .ai-message {
        max-width: 88%;
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        white-space: pre-wrap;
        line-height: 1.45;
        font-size: 14px;
      }

      .ai-message.assistant {
        margin-right: auto;
        background: white;
        border: 1px solid #e2e8f0;
        color: #334155;
      }

      .ai-message.user {
        margin-left: auto;
        background: #ccfbf1;
        color: #134e4a;
      }

      .ai-quick-actions {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding: 10px 12px 0;
        background: #f8fafc;
      }

      .ai-quick-actions button {
        flex: 0 0 auto;
        border: 1px solid #99f6e4;
        border-radius: 999px;
        padding: 6px 9px;
        background: white;
        color: #115e59;
        font-size: 12px;
      }

      .ai-form {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #e2e8f0;
        background: white;
      }

      .ai-form input {
        min-width: 0;
        flex: 1;
      }

      .ai-send {
        width: 42px;
        border: 0;
        border-radius: 8px;
        background: #0f766e;
        color: white;
        font-size: 18px;
      }

      /* ================= EMPTY ================= */

      .empty {
        text-align: center;
        padding: 40px 20px;
        color: #64748b;
      }
      /* ================= FIX PARKING UI ================= */

      .area {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 22px;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
      }

      .area-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 16px;
      }

      .area-info {
        min-width: 0;
      }

      .area-name {
        font-size: 20px;
        font-weight: 700;
        color: #172554;
      }

      .area-description {
        color: #64748b;
        font-size: 14px;
        margin-top: 5px;
      }

      .area-count {
        display: inline-block;
        margin-top: 8px;
        padding: 5px 10px;
        background: #eff6ff;
        color: #2563eb;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }

      .area-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .parking-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(130px, 1fr));
        gap: 14px;
      }

      .slot {
        min-height: 120px;
        border-radius: 12px;
        padding: 16px;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .slot.available {
        background: #16a34a;
      }

      .slot.occupied {
        background: #dc2626;
      }

      .slot.reserved {
        background: #f59e0b;
      }

      .slot-code {
        font-size: 23px;
        font-weight: 800;
      }

      .slot-status {
        font-size: 14px;
        margin-top: 4px;
      }

      .slot-actions {
        display: flex;
        gap: 7px;
        margin-top: 15px;
      }

      .slot-actions button {
        width: 34px;
        height: 32px;
        border: 0;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.18);
        color: white;
        cursor: pointer;
      }

      .slot-empty {
        grid-column: 1 / -1;
        min-height: 120px;
        border: 1px dashed #cbd5e1;
        background: #f8fafc;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        color: #64748b;
      }

      .ticket-summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 22px;
      }

      .chart-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        margin-top: 22px;
      }

      .chart-card {
        min-width: 0;
        background: linear-gradient(160deg, #fff 0%, #fbfdff 100%);
        border: 1px solid #e6edf7;
        border-radius: 19px;
        padding: 20px;
        box-shadow: 0 5px 16px rgba(18, 38, 71, 0.04);
      }

      .chart-card h3 {
        margin-bottom: 18px;
        font-size: 16px;
        color: #1d2b45;
        letter-spacing: -0.015em;
      }

      .line-chart {
        display: block;
        width: 100%;
        height: auto;
        min-height: 195px;
        overflow: visible;
      }

      .chart-gridline {
        stroke: #e9eef6;
        stroke-width: 1;
      }

      .chart-axis-label {
        fill: #8491a6;
        font-family: Arial, sans-serif;
        font-size: 11px;
      }

      .chart-area {
        opacity: 0.16;
      }

      .chart-line {
        fill: none;
        stroke: #3478f6;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
        transition: stroke-width 180ms ease;
      }

      .chart-line.chart-line-teal {
        stroke: #10a786;
      }

      .chart-point {
        cursor: pointer;
        outline: none;
      }

      .chart-point circle {
        fill: #fff;
        stroke: #3478f6;
        stroke-width: 3;
        vector-effect: non-scaling-stroke;
        transition: r 150ms ease, stroke-width 150ms ease;
      }

      .chart-point.chart-point-teal circle {
        stroke: #10a786;
      }

      .chart-point:hover circle,
      .chart-point:focus circle {
        r: 6;
        stroke-width: 4;
      }

      .chart-card:hover .chart-line {
        stroke-width: 3.5;
      }

      .chart-tooltip {
        fill: #172033;
        font-family: Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
      }

      .workflow-panel {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
      }

      .workflow-step {
        background: linear-gradient(160deg, #f8fbff 0%, #fff 80%);
        border: 1px solid #e6edf7;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 6px 20px rgba(18, 38, 71, 0.045);
        transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
      }

      .workflow-step:hover {
        border-color: #cbdcf7;
        box-shadow: 0 12px 28px rgba(18, 38, 71, 0.08);
        transform: translateY(-2px);
      }

      .workflow-step .step-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: linear-gradient(145deg, #eaf2ff, #dceaff);
        color: #2563eb;
        margin-bottom: 15px;
      }

      .workflow-step .step-icon svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .workflow-step h4 {
        font-size: 15px;
        line-height: 1.4;
        margin-bottom: 8px;
      }

      .workflow-step p {
        color: #64748b;
        line-height: 1.5;
        font-size: 13px;
        margin-bottom: 0;
      }

      .workflow-actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        flex-wrap: wrap;
      }

      .pricing-guide {
        margin: 0 0 16px;
        padding: 14px 16px;
        border: 1px solid #bfdbfe;
        border-radius: 14px;
        background: #eff6ff;
        color: #1e3a8a;
        font-size: 13px;
        line-height: 1.55;
      }

      .pricing-guide strong {
        color: #1d4ed8;
      }

      .price-duration {
        display: grid;
        gap: 3px;
      }

      .price-duration small {
        color: #64748b;
      }

      .price-status {
        display: inline-flex;
        padding: 5px 9px;
        border-radius: 999px;
        background: #dcfce7;
        color: #166534;
        font-size: 12px;
        font-weight: 700;
      }

      .price-status.inactive {
        background: #f1f5f9;
        color: #64748b;
      }

      .mini-list {
        display: grid;
        gap: 10px;
      }

      .mini-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 9px 10px;
        border-radius: 10px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
      }

      .mini-row span {
        color: #475569;
        font-size: 12px;
      }

      .mini-row strong {
        color: #0f172a;
        font-size: 14px;
      }

      .overview-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 18px;
        margin-bottom: 20px;
      }

      .overview-card {
        background: linear-gradient(135deg, #f8fbff 0%, #ffffff 100%);
        border: 1px solid #dbeafe;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 10px 24px rgba(59, 130, 246, 0.08);
      }

      .overview-card.primary {
        background: linear-gradient(135deg, #eff6ff 0%, #ffffff 52%, #ecfeff 100%);
      }

      .overview-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .overview-kpi {
        font-size: 12px;
        color: #475569;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .overview-number {
        font-size: 36px;
        font-weight: 800;
        line-height: 1.1;
        color: #0f172a;
      }

      .overview-trend {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: #dcfce7;
        color: #166534;
        font-size: 12px;
        font-weight: 700;
      }

      .spark-bars {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        align-items: end;
        gap: 8px;
        height: 110px;
        margin-top: 12px;
      }

      .spark-bars span {
        display: block;
        border-radius: 10px 10px 0 0;
        background: linear-gradient(180deg, #60a5fa, #2563eb);
        opacity: 0.88;
      }

      .insight-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .insight-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: #f8fafc;

      .insight-label {
        color: #475569;
        font-size: 13px;

      .insight-value {

      .parking-filters {

      .mini-card {

        border: 1px solid #e7edf5;

        padding: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        box-shadow: 0 4px 14px rgba(18, 38, 71, 0.035);
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .mini-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(18, 38, 71, 0.08);
      }

      .mini-card span {
        color: #64748b;
      }

      .mini-card strong {
        font-size: 24px;
        color: #1c376b;
        text-align: right;
      }

      .error-panel {
        border-color: #fecaca;
        background: #fffafa;
      }

      .area-stat-list {
        background: #fff;
        border: 1px solid #e2e8f0;

      .area-stat-row {

        align-items: center;
        padding: 16px 18px;
        border-bottom: 1px solid #e2e8f0;

      .area-stat-row:last-child {
        border-bottom: 0;
      }

      .area-stat-values {
        display: flex;
        gap: 16px;
      }

      .text-green {
        color: #15803d !important;
      }

      .text-red {
        color: #b91c1c !important;
      }
      /* ================= RESPONSIVE ================= */

      @media (max-width: 1000px) {
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .parking-grid {
          grid-template-columns: repeat(3, 1fr);
        }

        .chart-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 700px) {
        .sidebar {
          display: none;
        }

        .content {
          padding: 15px;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .parking-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .parking-filters {
          grid-template-columns: 1fr;
        }

        .header {
          padding: 0 15px;
        }

        .user-info {
          gap: 8px;
          font-size: 13px;
        }

        .stats {
          gap: 10px;
        }

        .stat-card {
          min-height: 112px;
          padding: 15px;
          border-radius: 16px;
        }

        .stat-icon {
          width: 32px;
          height: 32px;
          border-radius: 10px;
          font-size: 15px;
        }

        .stat-number {
          margin-top: 10px;
        }

        .ticket-summary,
        .workflow-panel {
          grid-template-columns: 1fr;
        }

        .chart-card {
          padding: 15px;
        }

        .chart-axis-label {
          font-size: 10px;
        }

        .ai-launcher {
          right: 15px;
          bottom: 15px;
        }

        .ai-panel {
          right: 15px;
          bottom: 70px;
          height: min(560px, calc(100vh - 90px));
        }
      }
    </style>
  </head>

  <body>
    <header class="header">
      <div class="logo">🅿️ PARKING</div>

      <div class="user-info">
        👤 <span id="username">Quản trị viên</span>

        <button class="logout" onclick="logout()">Đăng xuất</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="menu-title">QUẢN LÝ</div>

        <button
          class="menu-item active"
          id="menuParking"
          onclick="showParking()"
        >
          🅿️ Bãi đỗ xe
        </button>

        <button class="menu-item" id="menuVehicles" onclick="showVehicles()">
          🚗 Phương tiện
        </button>

        <button class="menu-item" id="menuTickets" onclick="showTickets()">
          🎫 Vé xe
        </button>

        <button class="menu-item" id="menuPrices" onclick="showPrices()">
          💵 Bảng giá
        </button>

        <button class="menu-item" id="menuRevenue" onclick="showRevenue()">
          💰 Doanh thu
        </button>

        <div class="menu-title">PHÂN TÍCH</div>

        <button
          class="menu-item"
          id="menuStatistics"
          onclick="showStatistics()"
        >
          📊 Thống kê
        </button>
      </aside>

      <main class="content">
        <div class="report-chip">📊 Dashboard báo cáo nghiệp vụ</div>
        <h1 class="page-title" id="pageTitle">Quản lý bãi đỗ xe</h1>
        <p class="subtitle" id="pageSubtitle">Theo dõi tình trạng chỗ đỗ, doanh thu và lưu lượng theo giờ</p>
        <section class="stats">
          <div class="stat-card">
            <div class="stat-card-head">
              <div class="stat-label">Tổng vị trí</div>
              <span class="stat-icon" aria-hidden="true">🅿️</span>
            </div>
            <div class="stat-number" id="totalSlots">--</div>
          </div>

          <div class="stat-card">
            <div class="stat-card-head">
              <div class="stat-label">Chỗ trống</div>
              <span class="stat-icon" aria-hidden="true">🟢</span>
            </div>
            <div class="stat-number" id="availableSlots">--</div>
          </div>

          <div class="stat-card">
            <div class="stat-card-head">
              <div class="stat-label">Đang đỗ</div>
              <span class="stat-icon" aria-hidden="true">🚘</span>
            </div>
            <div class="stat-number" id="occupiedSlots">--</div>
          </div>

          <div class="stat-card">
            <div class="stat-card-head">
              <div class="stat-label">Đã giữ</div>
              <span class="stat-icon" aria-hidden="true">🔖</span>
            </div>
            <div class="stat-number" id="reservedSlots">--</div>
          </div>
        </section>

        <div id="mainContent"></div>
      </main>
    </div>

    <div class="modal" id="modal">
      <div class="modal-box">
        <div class="modal-title" id="modalTitle">Thao tác</div>

        <div id="modalBody"></div>
        <div id="modalFeedback" class="modal-feedback" role="alert" aria-live="polite" hidden></div>

        <div class="modal-actions">
          <button class="btn btn-gray" onclick="closeModal()">Hủy</button>

          <button
            class="btn btn-primary"
            id="modalSaveButton"
          onclick="saveModalWithFeedback()"
          >
            Lưu
          </button>
        </div>
      </div>
    </div>

    <button
      class="ai-launcher"
      id="aiLauncher"
      type="button"
      onclick="toggleAiChat()"
      aria-controls="aiPanel"
      aria-expanded="false">
      🤖 Parking
    </button>

    <section class="ai-panel" id="aiPanel" aria-label="Parking Assistant">
      <header class="ai-header">
        <strong>🤖 Parking</strong>
        <button class="ai-close" type="button" onclick="toggleAiChat()" aria-label="Đóng trợ lý">×</button>
      </header>

      <div class="ai-messages" id="aiMessages" role="log" aria-live="polite">
        <div class="ai-message assistant">
          Xin chào! Tôi có thể giúp bạn phân tích dữ liệu bãi đỗ hiện tại.
        </div>
      </div>

      <div class="ai-quick-actions" aria-label="Câu hỏi nhanh">
        <button type="button" onclick="askAi('Bãi còn bao nhiêu chỗ?')">Chỗ trống?</button>
        <button type="button" onclick="askAi('Doanh thu hôm nay bao nhiêu?')">Doanh thu hôm nay?</button>
        <button type="button" onclick="askAi('Bãi đang sử dụng bao nhiêu phần trăm công suất?')">Công suất?</button>
      </div>

      <form class="ai-form" id="aiForm">
        <input id="aiInput" type="text" placeholder="Nhập câu hỏi..." autocomplete="off" aria-label="Câu hỏi cho Parking">
        <button class="ai-send" type="submit" aria-label="Gửi câu hỏi">➤</button>
      </form>
    </section>

    <script>
            let modalMode = null;
            let selectedId = null;
            let selectedAreaId = null;
            let parkingAreaData = [];
            let statsTimer = null;

            const token = () => localStorage.getItem("access_token");
            function updateStats(total, available, occupied, reserved) {
              document.getElementById("totalSlots").textContent = Number(total || 0);
              document.getElementById("availableSlots").textContent = Number(available || 0);
              document.getElementById("occupiedSlots").textContent = Number(occupied || 0);
              document.getElementById("reservedSlots").textContent = Number(reserved || 0);
            }

            async function refreshStats() {
              try {
                const data = await api("/api/dashboard/summary");
                updateStats(
                  data.total_slots,
                  data.available_slots,
                  data.occupied_slots,
                  data.reserved_slots,
                );
              } catch (error) {
                console.error("Không thể tải chỉ số tổng quan:", error);
              }
            }

            function filterParking() {
              const query = (
                document.getElementById("parkingSearch")?.value || ""
              ).trim().toLowerCase();
              const status =
                document.getElementById("parkingStatusFilter")?.value || "";
              const areaId =
                document.getElementById("parkingAreaFilter")?.value || "";

              document.querySelectorAll(".area[data-area-id]").forEach((area) => {
                const matchesArea = !areaId || area.dataset.areaId === areaId;
                let visibleSlots = 0;

                area.querySelectorAll(".slot").forEach((slot) => {
                  const matchesQuery = !query || [
                    slot.dataset.slotCode,
                    slot.dataset.vehicleType,
                    slot.textContent,
                  ].some((value) => value.toLowerCase().includes(query));
                  const matchesStatus = !status || slot.dataset.status === status;
                  const visible = matchesArea && matchesQuery && matchesStatus;

                  slot.style.display = visible ? "" : "none";
                  if (visible) {
                    visibleSlots += 1;
                  }
                });

                area.style.display = matchesArea && (visibleSlots > 0 || !query && !status)
                  ? ""
                  : "none";
              });
            }

            function filterRows(inputId, rowSelector) {
              const query = (
                document.getElementById(inputId)?.value || ""
              ).trim().toLowerCase();

              document.querySelectorAll(rowSelector).forEach((row) => {
                row.style.display = row.textContent.toLowerCase().includes(query)
                  ? ""
                  : "none";
              });
            }

            function apiError(data) {
              if (!data) {
                return "Máy chủ không trả về thông tin lỗi";
              }

              if (typeof data === "string") {
                return data;
              }

              if (typeof data.detail === "string") {
                return data.detail;
              }

              if (Array.isArray(data.detail)) {
                return data.detail
                  .map((item) => {
                    if (typeof item === "string") {
                      return item;
                    }

                    if (item.msg) {
                      return item.msg;
                    }

                    return JSON.stringify(item);
                  })
                  .join("\n");
              }

              if (data.message) {
                return data.message;
              }

              return Object.keys(data).length ? JSON.stringify(data) : "Máy chủ trả về lỗi nhưng không có nội dung chi tiết";
            }

            async function api(url, options = {}) {
              const response = await fetch(url, {
                ...options,

                headers: {
                  ...(options.headers || {}),
                  Authorization: "Bearer " + token(),
                },
              });

              const responseText = await response.text();
              let data = {};
              if (responseText) {
                try {
                  data = JSON.parse(responseText);
                } catch {
                  data = responseText;
                }
              }

              if (response.status === 401) {
                localStorage.removeItem("access_token");
                localStorage.removeItem("username");

                window.location.href = "/login";

                throw new Error("Phiên đăng nhập đã hết hạn");
              }

              if (!response.ok) {
                const detail = apiError(data);
                throw new Error(
                  `HTTP ${response.status}${response.statusText ? ` ${response.statusText}` : ""}: ${detail}`,
                );
              }

              return data;
            }

            function toggleAiChat() {
              const panel = document.getElementById("aiPanel");
              const launcher = document.getElementById("aiLauncher");
              const isOpen = panel.classList.toggle("show");

              launcher.setAttribute("aria-expanded", String(isOpen));
              if (isOpen) {
                document.getElementById("aiInput").focus();
              }
            }

            function appendAiMessage(role, message) {
              const messages = document.getElementById("aiMessages");
              const item = document.createElement("div");
              item.className = `ai-message ${role}`;
              item.textContent = message;
              messages.appendChild(item);
              messages.scrollTop = messages.scrollHeight;
              return item;
            }

            async function askAi(question) {
              const input = document.getElementById("aiInput");
              const text = (question || input.value).trim();
              if (!text) {
                return;
              }

              input.value = "";
              appendAiMessage("user", text);
              const loading = appendAiMessage("assistant", "Đang đọc dữ liệu bãi đỗ...");

              try {
                const result = await api("/api/ai/assistant", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({ question: text }),
                });
                loading.textContent = result.answer || "Không có dữ liệu trả lời.";
              } catch (error) {
                loading.textContent = error.message || "Không thể truy vấn dữ liệu bãi đỗ.";
              }
            }

            function escapeHtml(value) {
              const div = document.createElement("div");

              div.textContent = value ?? "";

              return div.innerHTML;
            }

            function setMenu(id) {
              document
                .querySelectorAll(".menu-item")
                .forEach((x) => x.classList.remove("active"));

              if (id) {
                document.getElementById(id)?.classList.add("active");
              }
            }

            function openModal(title, body, mode) {
              modalMode = mode;

              document.getElementById("modalTitle").textContent = title;

              document.getElementById("modalBody").innerHTML = body;
              clearModalFeedback();
              document.getElementById("modalSaveButton").style.display =
                mode === "viewSlot" ? "none" : "";

              document.getElementById("modal").classList.add("show");
            }

            function showModalFeedback(message) {
              const feedback = document.getElementById("modalFeedback");
              feedback.textContent = message;
              feedback.hidden = false;
            }

            function clearModalFeedback() {
              const feedback = document.getElementById("modalFeedback");
              feedback.textContent = "";
              feedback.hidden = true;
            }

            function closeModal() {
              document.getElementById("modal").classList.remove("show");

              modalMode = null;
              selectedId = null;
              selectedAreaId = null;
              document.getElementById("modalSaveButton").style.display = "";
            }

            function startLiveDashboard() {
              if (statsTimer) {
                clearInterval(statsTimer);
              }

              refreshStats();
              statsTimer = setInterval(refreshStats, 10000);
            }

            async function showParking() {
              setMenu("menuParking");
              refreshStats();

              document.getElementById("pageTitle").textContent = "Quản lý bãi đỗ xe";

              document.getElementById("pageSubtitle").textContent =
                "Quản lý khu vực, vị trí và trạng thái";

              await loadParking();
            }

            async function loadParking() {
              const content = document.getElementById("mainContent");

              content.innerHTML = `
                                <div class="panel">
                                    <div class="empty">
                                        ⏳ Đang tải dữ liệu bãi đỗ...
                                    </div>
                                </div>
                            `;

              try {
                const result = await api("/api/areas/");
                const areas = Array.isArray(result) ? result : [];

                let totalSlots = 0;
                let availableSlots = 0;
                let occupiedSlots = 0;
                let reservedSlots = 0;

                const areaData = [];

                for (const area of areas) {
                  let slots = [];

                  try {
                    const data = await api(`/api/areas/${area.id}/slots`);

                    slots = Array.isArray(data) ? data : [];
                  } catch (error) {
                    console.error("Lỗi tải vị trí khu vực:", area.id, error);
                  }

                  totalSlots += slots.length;

                  availableSlots += slots.filter(
                    (slot) => slot.status === "available",
                  ).length;

                  occupiedSlots += slots.filter(
                    (slot) => slot.status === "occupied",
                  ).length;

                  reservedSlots += slots.filter(
                    (slot) => slot.status === "reserved",
                  ).length;

                  areaData.push({
                    area,
                    slots,
                  });
                }

                parkingAreaData = areaData;

                const occupancyRate = totalSlots ? Math.round((occupiedSlots / totalSlots) * 100) : 0;
                const utilization = totalSlots ? Math.round((availableSlots / totalSlots) * 100) : 0;
                const maxBars = [72, 98, 84, 120, 146, 118, 132, 158, 142];

                let html = `
                                    <div class="panel">

                                        <div class="panel-header">

                                            <div>
                                                <div class="panel-title">
                                                    🅿️ Sơ đồ bãi đỗ
                                                </div>

                                                <div class="panel-subtitle">
                                                    Quản lý khu vực và vị trí đỗ xe
                                                </div>
                                            </div>

                                            <button
                                                class="btn btn-primary"
                                                onclick="addArea()">
                                                ➕ Thêm khu vực
                                            </button>

                                        </div>

                                        <div class="overview-grid">
                                          <div class="overview-card primary">
                                            <div class="overview-header">
                                              <div>
                                                <div class="overview-kpi">Tình trạng bãi</div>
                                                <div class="overview-number">${occupancyRate}%</div>
                                              </div>
                                              <div class="overview-trend">📈 Hiện tại</div>
                                            </div>
                                            <div class="spark-bars">
                                              ${maxBars.map((value) => `<span style="height:${(value / 160) * 100}%"></span>`).join("")}
                                            </div>
                                          </div>
                                          <div class="overview-card">
                                            <div class="overview-header">
                                              <div>
                                                <div class="overview-kpi">Tổng quan</div>
                                                <div class="overview-number">${totalSlots}</div>
                                              </div>
                                            </div>
                                            <div class="insight-list">
                                              <div class="insight-item">
                                                <span class="insight-label">Còn trống</span>
                                                <span class="insight-value text-green">${availableSlots}</span>
                                              </div>
                                              <div class="insight-item">
                                                <span class="insight-label">Đang đỗ</span>
                                                <span class="insight-value text-red">${occupiedSlots}</span>
                                              </div>
                                              <div class="insight-item">
                                                <span class="insight-label">Tỷ lệ sử dụng</span>
                                                <span class="insight-value">${utilization}%</span>
                                              </div>
                                            </div>
                                          </div>
                                        </div>

                                        <div class="workflow-panel">
                                          <div class="workflow-step">
                                            <span class="step-icon" aria-hidden="true">
                                              <svg viewBox="0 0 24 24"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11"/><path d="M3.5 11h17v7h-17zM6 18v1.5m12-1.5v1.5M6 14h.01M18 14h.01"/></svg>
                                            </span>
                                            <h4>Xe vào bãi</h4>
                                            <p>Nhân viên chọn biển số, khu vực và vị trí còn trống để check-in.</p>
                                          </div>
                                          <div class="workflow-step">
                                            <span class="step-icon" aria-hidden="true">
                                              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3m5 0h2"/></svg>
                                            </span>
                                            <h4>Tính phí tự động</h4>
                                            <p>Hệ thống đọc thời gian gửi, áp dụng bảng giá theo loại xe.</p>
                                          </div>
                                          <div class="workflow-step">
                                            <span class="step-icon" aria-hidden="true">
                                              <svg viewBox="0 0 24 24"><path d="M14 5h5a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/><path d="M10 16l4-4-4-4m4 4H3"/><path d="M6 19H4a2 2 0 0 1-2-2v-2"/></svg>
                                            </span>
                                            <h4>Xe ra & giải phóng</h4>
                                            <p>Thanh toán xong, vị trí được cập nhật thành trống và doanh thu ghi nhận.</p>
                                          </div>
                                        </div>

                                        <div class="workflow-actions">
                                          <button class="btn btn-primary" onclick="vehicleEntry()">🚗 Mô phỏng xe vào</button>
                                          <button class="btn btn-success" onclick="showTickets()">🎫 Xem quy trình vé</button>
                                        </div>

                                        <div class="parking-filters">
                                          <input
                                            id="parkingSearch"
                                            class="form-control"
                                            placeholder="Tìm mã vị trí hoặc biển số"
                                            oninput="filterParking()">
                                          <select
                                            id="parkingStatusFilter"
                                            class="form-control"
                                            onchange="filterParking()">
                                            <option value="">Tất cả trạng thái</option>
                                            <option value="available">Trống</option>
                                            <option value="occupied">Đang đỗ</option>
                                            <option value="reserved">Đã giữ</option>
                                            <option value="inactive">Không hoạt động</option>
                                          </select>
                                          <select
                                            id="parkingAreaFilter"
                                            class="form-control"
                                            onchange="filterParking()">
                                            <option value="">Tất cả khu vực</option>
                                            ${areas.map((area) => `
                                              <option value="${area.id}">${escapeHtml(area.name)}</option>
                                            `).join("")}
                                          </select>
                                        </div>

                                        <div class="ticket-summary">

                                            <div class="mini-card">
                                                <span>📍 Tổng vị trí</span>
                                                <strong>${totalSlots}</strong>
                                            </div>

                                            <div class="mini-card">
                                                <span>🟢 Vị trí trống</span>
                                                <strong>${availableSlots}</strong>
                                            </div>

                                            <div class="mini-card">
                                                <span>🔴 Đang đỗ</span>
                                                <strong>${occupiedSlots}</strong>
                                            </div>

                                        </div>
                                `;

                if (!areaData.length) {
                  html += `
                                        <div class="empty parking-empty">

                                            <div class="empty-icon">
                                                🅿️
                                            </div>

                                            <strong>
                                                Chưa có khu vực
                                            </strong>

                                            <span>
                                                Hãy bấm "Thêm khu vực" để bắt đầu.
                                            </span>

                                        </div>
                                    `;
                } else {
                  areaData.forEach(({ area, slots }) => {
                    html += `
                                            <div class="area" data-area-id="${area.id}">

                    value: Math.max(0, Number(entry.revenue || 0)),

                    { label: "-", value: 0 },
                    { label: "-", value: 0 },
                  ];

              return buildLineChart(items, {
                id: "daily-revenue",
                color: "blue",
                currency: true,
                description: "Doanh thu theo ngày",
              });
            }

            function buildHourlyTrafficChart(tickets) {
              const hourly = Array.from({ length: 24 }, (_, hour) => {
                const count = (Array.isArray(tickets) ? tickets : []).filter((ticket) => {
                  const raw = ticket.entry_time || ticket.check_in;
                  if (!raw) return false;
                  const date = parseAppDate(raw);
                  return !Number.isNaN(date.getTime()) && date.getHours() === hour;
                }).length;

                return {
                  label: `${hour}:00`,
                  value: count,
                };
              });

              return buildLineChart(hourly, {
                id: "hourly-traffic",
                color: "teal",
                description: "Số lượt xe theo giờ",
                xLabelInterval: 3,
              });
            }

            function buildLineChart(items, options = {}) {
              const chartItems = Array.isArray(items) && items.length
                ? items.map((item) => {
                    const value = Number(item.value);
                    return {
                      label: String(item.label ?? ""),
                      value: Number.isFinite(value) ? Math.max(0, value) : 0,
                    };
                  })
                : [{ label: "Chưa có dữ liệu", value: 0 }];
              const width = 760;
              const height = 240;
              const left = 66;
              const right = 18;
              const top = 18;
              const bottom = 38;
              const plotWidth = width - left - right;
              const plotHeight = height - top - bottom;
              const maxValue = Math.max(...chartItems.map((item) => item.value), 1);
              const points = chartItems.map((item, index) => ({
                ...item,
                x: chartItems.length === 1
                  ? left + plotWidth / 2
                  : left + (plotWidth * index) / (chartItems.length - 1),
                y: top + plotHeight - (item.value / maxValue) * plotHeight,
              }));
              const linePath = points.reduce((path, point, index) => {
                if (index === 0) return `M ${point.x} ${point.y}`;
                const previous = points[index - 1];
                const beforePrevious = points[index - 2] || previous;
                const next = points[index + 1] || point;
                const controlOneX = previous.x + (point.x - beforePrevious.x) / 6;
                const controlOneY = previous.y + (point.y - beforePrevious.y) / 6;
                const controlTwoX = point.x - (next.x - previous.x) / 6;
                const controlTwoY = point.y - (next.y - previous.y) / 6;
                return `${path} C ${controlOneX} ${controlOneY}, ${controlTwoX} ${controlTwoY}, ${point.x} ${point.y}`;
              }, "");
              const baseline = top + plotHeight;
              const areaPath = `${linePath} L ${points[points.length - 1].x} ${baseline} L ${points[0].x} ${baseline} Z`;
              const gradientId = `chart-gradient-${String(options.id || "data").replace(/[^a-z0-9-]/gi, "")}`;
              const lineClass = options.color === "teal" ? "chart-line chart-line-teal" : "chart-line";
              const pointClass = options.color === "teal" ? "chart-point chart-point-teal" : "chart-point";
              const valueLabel = (value) => options.currency ? formatMoney(value) : `${value} lượt`;
              const gridLines = [0, 0.5, 1].map((ratio) => {
                const y = top + plotHeight * (1 - ratio);
                const value = maxValue * ratio;
                const compact = (amount) => new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 1 }).format(amount);
                const label = options.currency
                  ? value >= 1_000_000_000
                    ? `${compact(value / 1_000_000_000)} tỷ ₫`
                    : value >= 1_000_000
                      ? `${compact(value / 1_000_000)} tr ₫`
                      : value >= 1_000
                        ? `${compact(value / 1_000)}k ₫`
                        : formatMoney(value)
                  : maxValue < 2 && ratio === 0.5
                    ? ""
                    : Math.round(value);
                return `
                  <g>
                    <line class="chart-gridline" x1="${left}" y1="${y}" x2="${width - right}" y2="${y}"></line>
                    <text class="chart-axis-label" x="${left - 10}" y="${y + 4}" text-anchor="end">${escapeHtml(label)}</text>
                  </g>
                `;
              }).join("");
              const chartPoints = points.map((point) => `
                <g class="${pointClass}" tabindex="0" role="graphics-symbol" aria-label="${escapeHtml(`${point.label}: ${valueLabel(point.value)}`)}">
                  <title>${escapeHtml(`${point.label}: ${valueLabel(point.value)}`)}</title>
                  <circle cx="${point.x}" cy="${point.y}" r="4"></circle>
                </g>
              `).join("");
              const xLabelInterval = Math.max(1, Number(options.xLabelInterval) || 1);
              const xLabels = points.map((point, index) => index % xLabelInterval === 0 || index === points.length - 1 ? `
                <text class="chart-axis-label" x="${point.x}" y="${height - 10}" text-anchor="middle">${escapeHtml(point.label)}</text>
              ` : "").join("");

              return `
                <svg class="line-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(options.description || "Biểu đồ dữ liệu")}">
                  <defs>
                    <linearGradient id="${gradientId}" x1="0" x2="0" y1="0" y2="1">
                      <stop offset="0%" stop-color="${options.color === "teal" ? "#10a786" : "#3478f6"}" stop-opacity="0.32"></stop>
                      <stop offset="100%" stop-color="${options.color === "teal" ? "#10a786" : "#3478f6"}" stop-opacity="0.015"></stop>
                    </linearGradient>
                  </defs>
                  ${gridLines}
                  <path class="chart-area" d="${areaPath}" fill="url(#${gradientId})"></path>
                  <path class="${lineClass}" d="${linePath}"></path>
                  ${chartPoints}
                  ${xLabels}
                </svg>
              `;
            }

            function statBox(icon, title, value) {
              return `
                <article class="stat-card">
                  <div class="stat-card-head">
                    <div class="stat-label">${escapeHtml(title)}</div>
                    <span class="stat-icon" aria-hidden="true">${icon}</span>
                  </div>
                  <div class="stat-number">${escapeHtml(value)}</div>
                </article>
              `;
            }

            /* =====================================================
                           SAVE MODAL
                        ===================================================== */

            async function saveModal() {
              if (modalMode === "addArea" || modalMode === "editArea") {
                const name = document.getElementById("areaName").value.trim();

                const description = document
                  .getElementById("areaDescription")
                  .value.trim();
                const vehicleType = document.getElementById("areaVehicleType").value;
                const capacity = Number(document.getElementById("areaCapacity").value);

                if (!name) {
                  alert("❌ Tên khu vực không được để trống");

                  return;
                }

                if (!Number.isInteger(capacity) || capacity < 0) {
                  alert("❌ Sức chứa phải là số nguyên không âm");

                  return;
                }

                const areaParams = new URLSearchParams();
                areaParams.append("name", name);
                areaParams.append("description", description);
                areaParams.append("vehicle_type", vehicleType);
                areaParams.append("capacity", String(capacity));

                await api(
                  modalMode === "addArea"
                    ? "/api/areas/"
                    : `/api/areas/${selectedId}`,
                  {
                  method: modalMode === "addArea" ? "POST" : "PUT",
                    headers: {
                      "Content-Type": "application/x-www-form-urlencoded",
                    },
                    body: areaParams.toString(),
                  },
                );

                alert(
                  modalMode === "addArea"
                    ? "✅ Đã thêm khu vực"
                    : "✅ Đã sửa khu vực",
                );

                closeModal();

                await loadParking();

                return;
              }

              /* ---------- SLOT ADD ---------- */

              if (modalMode === "addSlot") {
                const code = document.getElementById("slotCode").value.trim();

                if (!code) {
                  alert("❌ Mã vị trí không được để trống");

                  return;
                }

                await api("/api/slots/", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    slot_code: code,
                    area_id: selectedAreaId,
                    status: "available",
                  }),
                });

                alert("✅ Đã thêm vị trí");

                closeModal();

                loadParking();

                return;
              }

              /* ---------- SLOT EDIT ---------- */

              if (modalMode === "editSlot" || modalMode === "statusSlot") {
                const code = document.getElementById("slotCode")?.value.trim() || "";

                const status = document.getElementById("slotStatus").value;

                await api(`/api/areas/slots/${selectedId}`, {
                  method: "PUT",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    slot_code: code,
                    status,
                  }),
                });

                alert("✅ Đã cập nhật vị trí");

                closeModal();

                loadParking();

                return;
              }

              /* ---------- VEHICLE ---------- */

              if (modalMode === "addVehicle" || modalMode === "editVehicle") {
                const plate = document.getElementById("vehiclePlate").value.trim();

                const type = document.getElementById("vehicleType").value;

                const customerId = document.getElementById("vehicleCustomer")?.value || "";

                if (!plate) {
                  alert("❌ Biển số không được để trống");

                  return;
                }

                if (!customerId) {
                  alert("❌ Vui lòng chọn khách hàng cho phương tiện");

                  return;
                }

                const params = new URLSearchParams();

                params.append("license_plate", plate);

                params.append("vehicle_type", type);

                params.append("customer_id", customerId);

                await api(
                  modalMode === "addVehicle"
                    ? "/api/vehicles/"
                    : `/api/vehicles/${selectedId}`,

                  {
                    method: modalMode === "addVehicle" ? "POST" : "PUT",

                    headers: {
                      "Content-Type": "application/x-www-form-urlencoded",
                    },

                    body: params.toString(),
                  },
                );

                alert(
                  modalMode === "addVehicle"
                    ? "✅ Đã thêm phương tiện"
                    : "✅ Đã sửa phương tiện",
                );

                closeModal();

                showVehicles();

                return;
              }

              /* ---------- VEHICLE ENTRY ---------- */

              if (modalMode === "vehicleEntry") {
                const vehicleId = document.getElementById("entryVehicle").value;

                const slotId = document.getElementById("entrySlot").value;

                if (!vehicleId || !slotId) {
                  alert("❌ Cần chọn xe và vị trí");

                  return;
                }

                await api("/api/tickets/entry", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    vehicle_id: Number(vehicleId),
                    slot_id: Number(slotId),
                  }),
                });
                await loadParking();

                alert("✅ Xe đã vào bãi");

                closeModal();

                showTickets();

                return;
              }

              /* ---------- PRICE ---------- */

              if (modalMode === "addPrice" || modalMode === "editPrice") {
                const type = document.getElementById("priceVehicleType").value.trim();
                const fromMinute = Number(document.getElementById("priceFromMinute").value);
                const toMinute = Number(document.getElementById("priceToMinute").value);
                const amount = Number(document.getElementById("priceAmount").value);
                const effectiveFrom = document.getElementById("priceEffectiveFrom").value;
                const effectiveTo = document.getElementById("priceEffectiveTo").value;
                const status = document.getElementById("priceStatus").value;

                if (!Number.isInteger(fromMinute) || fromMinute < 0
                    || !Number.isInteger(toMinute) || toMinute < 0
                    || !Number.isFinite(amount) || amount < 0
                    || !effectiveFrom) {
                  showModalFeedback("Kiểm tra loại xe, khoảng thời gian, đơn giá và ngày hiệu lực.");
                  return;
                }

                if (toMinute !== 0 && toMinute < fromMinute) {
                  showModalFeedback("Mốc phút kết thúc phải lớn hơn hoặc bằng mốc bắt đầu.");
                  return;
                }

                const params = new URLSearchParams();

                params.append("vehicle_type", type);

                params.append("from_minute", String(fromMinute));
                params.append("to_minute", String(toMinute));
                params.append("price", String(amount));
                params.append("effective_from", effectiveFrom);
                params.append("effective_to", effectiveTo);
                params.append("status", status);

                await api(
                  modalMode === "addPrice"
                    ? "/api/prices/"
                    : `/api/prices/${selectedId}`,

                  {
                    method: modalMode === "addPrice" ? "POST" : "PUT",

                    headers: {
                      "Content-Type": "application/x-www-form-urlencoded",
                    },

                    body: params.toString(),
                  },
                );

                closeModal();

                showPrices();

                return;
              }

              throw new Error("Không xác định được loại dữ liệu cần lưu");
            }

            async function saveModalWithFeedback() {
              const saveButton = document.getElementById("modalSaveButton");
              if (saveButton.disabled) {
                return;
              }

              saveButton.disabled = true;
              try {
                await saveModal();
              } catch (error) {
                console.error("Không thể lưu dữ liệu:", error);
                const message = (error.message || "Không thể lưu dữ liệu.")
                  .replace(/^HTTP \d+(?: [^:]+)?:\s*/, "");
                showModalFeedback(message);
              } finally {
                saveButton.disabled = false;
              }
            }

              /* =====================================================
                         STATS HEADER
                      ===================================================== */

              /* =====================================================
               STATS HEADER
            ===================================================== */

              /* =====================================================
                           FORMAT
                        ===================================================== */

              function formatMoney(value) {
                const amount = Number(value);

                return `${Number.isFinite(amount) ? amount : 0}`.replace(
                  /\B(?=(\d{3})+(?!\d))/g,
                  ".",
                ) + " ₫";
              }

              function parseAppDate(value) {
                if (value instanceof Date) {
                  return value;
                }

                if (typeof value !== "string" || !value.trim()) {
                  return new Date(Number.NaN);
                }

                const normalized = value.trim().replace(" ", "T");
                if (/^\d{4}-\d{2}-\d{2}$/.test(normalized)) {
                  return new Date(`${normalized}T00:00:00`);
                }

                const hasTimezone = /(?:[zZ]|[+-]\d{2}:?\d{2})$/.test(normalized);
                return new Date(hasTimezone ? normalized : `${normalized}Z`);
              }

              function formatDate(value) {
                if (!value) {
                  return "-";
                }

                const date = parseAppDate(value);

                return Number.isNaN(date.getTime())
                  ? "-"
                  : date.toLocaleString("vi-VN");
              }

              /* =====================================================
                           LOGOUT
                        ===================================================== */

              function logout() {
                localStorage.removeItem("access_token");

                localStorage.removeItem("username");

                window.location.href = "/login";
              }

              /* =====================================================
                           USER
                        ===================================================== */

              const savedUsername = localStorage.getItem("username");

              if (savedUsername) {
                document.getElementById("username").textContent = savedUsername;
              }

              /* =====================================================
                           MODAL CLICK OUTSIDE
                        ===================================================== */

              document
                .getElementById("modal")
                .addEventListener("click", function (event) {
                  if (event.target === this) {
                    closeModal();
                  }
                });

                document
                  .getElementById("aiForm")
                  .addEventListener("submit", function (event) {
                    event.preventDefault();
                    askAi();
                  });

              /* =====================================================
                           START
                        ===================================================== */

              if (!token()) {
                window.location.href = "/login";
              } else {
                startLiveDashboard();
                showParking();
              }
    </script>
